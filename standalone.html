 120 g 鸡肉计算，大约可得到 2½ tbsp 乳化酱汁，足够拌鸡肉并调味一份配菜沙拉。","如果使用生鸡肉，可以在煎好后转小火，在锅中加入 1 tbsp 酱汁，让鸡肉裹上酱汁并轻微焦糖化 30–45 秒；剩下的酱汁冷拌沙拉。"],"sources":[],"filename":"recipes/cooked/honey-mustard-chicken-salad-sauce.md","referenceImage":null,"photos":[]}],"photos":[{"originalFile":"IMG_0497.HEIC","displayFile":"hand-torn-cabbage-2026-10-12.jpg","date":"2026-10-12","identifiedAs":"手撕包菜","matchStatus":"matched","recipeId":"hand-torn-cabbage","note":"可靠匹配手撕包菜；不能仅凭照片确定是哪一次尝试。","available":true,"publicPath":"./images/photos/hand-torn-cabbage-2026-10-12.jpg"},{"originalFile":"IMG_0633.HEIC","displayFile":"hand-torn-cabbage-2026-10-29.jpg","date":"2026-10-29","identifiedAs":"手撕包菜","matchStatus":"matched","recipeId":"hand-torn-cabbage","note":"可靠匹配手撕包菜；不能仅凭照片确定是哪一次尝试。","available":true,"publicPath":"./images/photos/hand-torn-cabbage-2026-10-29.jpg"},{"originalFile":"IMG_0579.HEIC","displayFile":"garlic-oyster-sauce-pak-choi-2026-10-25.jpg","date":"2026-10-25","identifiedAs":"蒜蓉蚝油 Pak Choi","matchStatus":"matched","recipeId":"garlic-oyster-sauce-pak-choi","note":"可靠匹配该菜谱。","available":true,"publicPath":"./images/photos/garlic-oyster-sauce-pak-choi-2026-10-25.jpg"},{"originalFile":"IMG_0504.HEIC","displayFile":"stir-fried-cabbage-vegetable-review-2026-10-15.jpg","date":"2026-10-15","identifiedAs":"醋溜白菜","matchStatus":"matched","recipeId":"vinegar-braised-cabbage","note":"用户确认这是醋溜白菜。","available":true,"publicPath":"./images/photos/stir-fried-cabbage-vegetable-review-2026-10-15.jpg"},{"originalFile":"IMG_0531.HEIC","displayFile":"pan-fried-green-peppers-review-2026-10-17.jpg","date":"2026-10-17","identifiedAs":"Padrón Peppers Tapas","matchStatus":"matched","recipeId":"padron-peppers-tapas","note":"用户确认这是西班牙 Padrón peppers tapas。","available":true,"publicPath":"./images/photos/pan-fried-green-peppers-review-2026-10-17.jpg"},{"originalFile":"IMG_0581.HEIC","displayFile":"soy-glazed-chicken-review-2026-10-25.jpg","date":"2026-10-25","identifiedAs":"可乐鸡翅","matchStatus":"matched","recipeId":"coca-cola-chic ed chili"],"seasonings":["Light soy sauce","Oyster sauce","Sugar"],"instructions":["Defrost the shrimp, drain them, and pat away excess moisture.","Mince the garlic and cut the dried chili into pieces; remove the seeds if desired.","Gently fry the garlic and dried chili in oil over low heat until fragrant.","Add the shrimp and stir-fry until fully cooked.","Add light soy sauce, oyster sauce, and a little sugar; toss to combine."],"experience":["I have cooked this dish.","Removing the seeds from dried chili reduces the heat.","Do not burn the garlic or dried chili, or they will taste bitter.","Drain frozen shrimp as thoroughly as possible."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: The Kitchn — Garlic Butter Shrimp"]},"blanched-iceberg-lettuce":{"title":"Blanched Iceberg Lettuce","category":"Vegetables","ingredients":["Iceberg lettuce"],"seasonings":["Garlic","Oyster sauce","Light soy sauce","Sugar","Oil"],"instructions":["Wash the lettuce and tear it into suitable pieces.","Briefly blanch it in boiling water.","Drain thoroughly.","Make a sauce with garlic, light soy sauce, oyster sauce, sugar, and a little water.","Pour the sauce over the lettuce."],"experience":["I have made it and thought it was delicious."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: DelishHomeCook — Iceberg Lettuce with Oyster Sauce"]},"garlic-oyster-sauce-pak-choi":{"title":"Garlic Oyster Sauce Pak Choi","category":"Vegetables","ingredients":["A reference recipe for about 2 pak choi","Pak choi: about 2 heads","Garlic: 2 cloves","Red chili: ½–1"],"seasonings":["Oyster sauce: 1 tbsp","Light soy sauce: 1 tsp","Dark soy sauce: a little, optional","Sesame oil: ½ tsp","Cornstarch: ¼ tsp or less","Water: about 3 tbsp, adjust as needed"],"instructions":["Wash the pak choi and cut each head in half or into quarters.","Place the stems in boiling water for about 10–15 seconds, then add the leaves and blanch briefly.","Drain thoroughly.","Heat oil in a pan and fry the garlic and red chili until fragrant.","Add the pre-mixed sauce and simmer briefly until slightly thickened.","Pour the sauce over the pak choi."],"experience":["I made this dish and took photos.","The leaves were a little too soft last time.","The sauce was too thick and there was slightly too much of it."],"improvements":["Shorten the blanching time.","Use less cornstarch or add a little more water.","There is no need to pour on so much sauce."],"sources":["Khin's Kitchen — Pak Choi with Garlic Sauce (source URL not recorded)"]},"tomato-and-eggs":{"title":"Tomato and Scrambled Eggs","category":"Eggs","ingredients":["Tomatoes","Eggs"],"seasonings":["Salt","Sugar","Oil"],"instructions":["Beat the eggs, stir-fry until just set, and remove from the pan.","Cut the tomatoes into chunks and stir-fry with salt until softened.","Press some of the tomato pieces to help release their juices.","Return the cooked eggs to the pan.","Adjust the flavor with sugar and salt."],"experience":["I have cooked this dish, but the last attempt was not very successful.","The tomatoes available in the UK were quite firm.","They stayed in chunks after cooking and released very little juice.","After adding water, the finished dish still became rather dry."],"improvements":["Buy ripe, softer tomatoes.","Cook the tomatoes separately for 4–6 minutes.","Cover the pan and braise briefly if needed.","Add a little tomato paste to help create more sauce when necessary."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: iCook — Tomato and Egg Stir-Fry"]},"hand-torn-cabbage":{"title":"Stir-Fried Hand-Torn Cabbage","category":"Vegetables","ingredients":["Sweetheart cabbage","Garlic","Dried chili"],"nextSeasonings":["Light soy sauce: 2 tsp","Vinegar: 1 tsp","Sugar: ¼–½ tsp"],"instructions":["Tear the cabbage into pieces, wash it, and drain thoroughly.","Mince the garlic and cut the dried chili into pieces.","Preheat the pan thoroughly and add oil.","Briefly fry the garlic and dried chili until fragrant.","Add the thicker stems first, followed by the leaves.","Stir-fry quickly over high heat.","Add light soy sauce, vinegar, and sugar at the end."],"experience":["I cooked it, but the last attempt was not ideal.","It was stir-fried for about 5 minutes.","The cabbage was tender but lacked wok-charred aroma.","There was some water at the bottom of the plate.","About 1 tbsp of vinegar may have been too much."],"improvements":["Drain the cabbage thoroughly after washing.","Make the pan hotter.","Cook in batches if there is too much cabbage.","Stir less frequently.","Try shortening the cooking time to about 2–3 minutes.","Start with 1 tsp vinegar."]},"pressure-cooker-chicken-soup":{"title":"Pressure Cooker Chicken Soup","category":"Soup","ingredients":["Chicken","Water"],"instructions":["Put the chicken in the pressure cooker.","Add water.","Cook the soup in the pressure cooker. About one hour was mentioned previously, but the exact pressure-cooking time and setting have not been confirmed."],"experience":["I have made this dish.","The seasonings, amount of chicken, and pressure-cooking time have not been recorded; these can be added next time."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: Wikimedia Commons — Chinese Food - Chicken Soup (CC BY-SA 3.0)"]},"soy-sauce-lamb-ribs":{"title":"Soy Sauce Lamb Ribs","category":"Meat","ingredients":["Lamb ribs"],"seasonings":["Soy sauce","Other seasonings not recorded"],"experience":["I have made this dish.","It was an improvised soy-sauce-style dish rather than a strict Chinese recipe."],"notes":["The image above is a web reference image, not a personal cooking photo; it shows a similar braised lamb-rib style rather than the actual finished dish."],"sources":["Web reference image: Sohu — Braised Lamb Ribs"]},"vinegar-braised-cabbage":{"title":"Vinegar-Fried Cabbage","category":"Vegetables","ingredients":["Cabbage: about 400 g","Garlic: about 10 g","Dried chili: about 5 g","Sichuan peppercorns: about 2 g, optional"],"seasonings":["Chinkiang vinegar: about 20 ml","Light soy sauce: about 10 ml","Sugar: about 5 g","Salt: about 3 g","Cooking oil: about 25 ml"],"instructions":["Separate the cabbage stems from the leaves; slice the stems diagonally and tear the leaves into large pieces.","Heat oil in a pan, fry the Sichuan peppercorns over low heat until fragrant, then remove them.","Add the dried chili and garlic and fry briefly until fragrant.","Turn the heat high, stir-fry the stems for about 1 minute, then add the leaves for about 30 seconds.","Pour the vinegar around the edge of the pan and toss quickly.","Add the soy sauce, sugar, and salt; toss briefly and serve immediately."],"experience":["I have made this dish and took a photo."],"improvements":["Not recorded. Public reference recipes emphasize separating stems and leaves and stir-frying quickly over high heat to reduce excess water and preserve crunch."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 15 October 2026 photo."],"sources":["Reference recipe: SciCook — Vinegar Cabbage"]},"padron-peppers-tapas":{"title":"Padrón Peppers Tapas","category":"Vegetables","ingredients":["Padrón peppers: about 500 g"],"seasonings":["Spanish olive oil: as needed (one public reference uses about 300 ml)","Sea-salt flakes: as needed"],"instructions":["Wash the Padrón peppers and drain them thoroughly.","Heat the olive oil in a pan.","Add the peppers and fry until the skins blister and turn golden.","Drain off excess oil, arrange on a plate, and sprinkle with sea salt. Serve hot."],"experience":["I have made this dish and took a photo.","This is a Spanish tapas dish."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 17 October 2026 photo."],"sources":["Reference recipe: Foods and Wines from Spain — Padrón Peppers"]},"coca-cola-chicken-wings":{"title":"Coca-Cola Chicken Wings","category":"Meat","ingredients":["Chicken wings: about 8","Sugared Coca-Cola: about 1 can"],"seasonings":["Salt: to taste","Shaoxing wine: about 1 tbsp","Light soy sauce: about 10 ml","Dark soy sauce: about 5–7 ml","Ginger: about 5 slices","Cinnamon: ½–1 stick, optional","Star anise: optional"],"instructions":["Score or pierce both sides of the wings to help them absorb flavor; marinate with cooking wine and dark soy sauce for about 30 minutes to 2 hours if desired.","Start the wings in cold water with ginger; bring to a boil, skim the foam, rinse with warm water, and pat dry.","Pan-fry the wings over low heat until golden on both sides.","Add the Coca-Cola, cooking wine, light soy sauce, dark soy sauce, and optional spices; the liquid should nearly cover the wings.","Simmer over low heat until the wings are cooked and the liquid has reduced.","Turn up the heat to reduce the sauce until it coats the wings; adjust with salt if needed."],"experience":["I have made this dish and took a photo."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 25 October 2026 photo."],"sources":["Reference recipe: Xiachufang — Coca-Cola Chicken Wings","Reference overview: Wikipedia — Coca-Cola Chicken Wings"]},"fish-vinaigrette":{"title":"Salmon, Egg and Mixed-Greens Salad with Fish Vinaigrette","category":"Salads","ingredients":["Mixed salad greens: 2–3 generous handfuls","Cooked salmon: 1 fillet, about 120–150 g","Hard-boiled eggs: 2","Cherry tomatoes: 8–10","Avocado: ½","Optional feta or another mild white cheese","Optional black sesame seeds"],"seasonings":["Extra-virgin olive oil: 3 parts","Vinegar: 1 part","Salt: to taste","Pepper: to taste","Italian spices: to taste"],"instructions":["Make the vinaigrette: add the olive oil, vinegar, salt, pepper, and Italian spices to a small transparent container with a firm lid. Seal it tightly and shake until combined.","Build the salad: arrange the greens in a large serving dish, add the tomatoes and avocado, then arrange the salmon and boiled eggs on top.","Finish: add the optional cheese and black sesame seeds, shake the vinaigrette again, drizzle it over the salad, and serve immediately."],"experience":["I have made this dish and took two finished-dish photos."],"notes":["Both photos belong to this salmon salad. The actual cooking date has not been recorded."]},"honey-mustard-chicken-salad-sauce":{"title":"Honey Mustard Chicken Salad","category":"Salads","ingredients":["Thinly sliced chicken breast: 120 g","Mixed salad greens: 2–3 generous handfuls","Hard-boiled eggs: 2","Cherry tomatoes: 8–10","Avocado: ½","A small handful of roughly chopped nuts","Optional feta or another mild white cheese","Optional black sesame seeds"],"seasonings":["Extra-virgin olive oil: 1 tbsp (15 ml)","Dijon mustard: 1 tbsp (15 g), or 2 tsp Dijon plus 1 tsp wholegrain mustard","Honey: 2 tsp (10 ml)","Apple cider vinegar or fresh lemon juice: 1 tsp (5 ml)","Fine sea salt: 1 pinch","Freshly cracked black pepper: 1 pinch","Optional garlic powder or fresh chives"],"instructions":["Prepare the chicken: if using raw chicken, season and cook it through, rest briefly, and slice thinly; use ready-cooked chicken slices directly.","Combine the dressing base: whisk the mustard, honey, vinegar or lemon juice, salt, and pepper until smooth.","Emulsify the oil: slowly drizzle in the olive oil while whisking briskly until glossy and thickened.","Adjust the consistency: whisk in ½ tsp warm water if a thinner dressing is wanted.","Assemble the salad: add the greens, tomatoes, and avocado, then arrange the eggs, chicken, nuts, and optional toppings.","Dress and serve: toss the chicken with half the dressing and drizzle the rest over the greens immediately before serving."],"note  er was iets te veel van."],"improvements":["Blancheer de paksoi korter.","Gebruik minder maïzena of voeg wat meer water toe.","Het is niet nodig om zoveel saus over de paksoi te gieten."],"sources":["Khin's Kitchen — Pak Choi with Garlic Sauce (bron-URL niet vastgelegd)"]},"tomato-and-eggs":{"title":"Roergebakken tomaat met ei","category":"Eieren","ingredients":["Tomaten","Eieren"],"seasonings":["Zout","Suiker","Olie"],"instructions":["Klop de eieren los, roerbak ze tot ze net gestold zijn en haal ze uit de pan.","Snijd de tomaten in stukken en roerbak ze met zout tot ze zacht worden.","Druk enkele tomaatstukken plat zodat ze hun sap loslaten.","Doe de gebakken eieren terug in de pan.","Breng op smaak met suiker en zout."],"experience":["Ik heb dit gerecht gemaakt, maar de vorige poging was niet erg geslaagd.","De tomaten die in het Verenigd Koninkrijk verkrijgbaar waren, waren vrij hard.","Ze bleven na het bakken in stukken en gaven weinig sap af.","Na het toevoegen van water werd het eindresultaat toch vrij droog."],"improvements":["Koop rijpe, zachtere tomaten.","Bak de tomaten eerst 4–6 minuten apart.","Dek de pan eventueel af en laat de tomaten kort stoven.","Voeg zo nodig een beetje tomatenpuree toe voor meer saus."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: iCook — Tomato and Eggs"]},"hand-torn-cabbage":{"title":"Met de hand gescheurde kool","category":"Groenten","ingredients":["Spitskool","Knoflook","Gedroogde chilipeper"],"instructions":["Scheur de kool in stukken, was die en laat goed uitlekken.","Hak de knoflook fijn en knip de gedroogde chilipeper in stukjes.","Verhit de pan goed en voeg olie toe.","Bak de knoflook en chilipeper kort tot ze geuren.","Voeg eerst de dikkere stronken toe en daarna de bladeren.","Roerbak snel op hoog vuur.","Voeg op het einde sojasaus, azijn en suiker toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen.","De bereiding duurde ongeveer 5 minuten.","De kool was mals, maar had weinig geroosterde smaak.","Er lag wat vocht op de bodem van het bord."],"improvements":["Laat de kool na het wassen goed uitlekken.","Verhit de pan sterker.","Bak in porties als er te veel kool is.","Roer minder vaak.","Probeer de baktijd te verkorten tot ongeveer 2–3 minuten.","Begin met 1 tl azijn."],"nextSeasonings":["Lichte sojasaus: 2 tl","Azijn: 1 tl","Suiker: ¼–½ tl"]},"pressure-cooker-chicken-soup":{"title":"Kippensoep uit de snelkookpan","category":"Soep","ingredients":["Kip","Water"],"instructions":["Doe de kip in de snelkookpan.","Voeg water toe.","Kook de soep in de snelkookpan. Eerder werd ongeveer een uur genoemd, maar de exacte kooktijd en instelling zijn nog niet bevestigd."],"experience":["Ik heb dit gerecht gemaakt.","De smaakmakers, de hoeveelheid kip en de kooktijd onder druk zijn niet vastgelegd; die kunnen de volgende keer worden toegevoegd."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: Wikimedia Commons — Chinese Food - Chicken Soup (CC BY-SA 3.0)"]},"soy-sauce-lamb-ribs":{"title":"Lamsribbetjes met sojasaus","category":"Vlees","ingredients":["Lamsribbetjes"],"seasonings":["Sojasaus","Andere smaakmakers niet vastgelegd"],"experience":["Ik heb dit gerecht gemaakt.","Het was een geïmproviseerd gerecht met sojasaus, geen strikt gevolgd Chinees recept."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto; ze toont een vergelijkbare gestoofde stijl met lamsribbetjes, niet het echte eindresultaat."],"sources":["Webreferentie: Sohu — Braised Lamb Ribs"]},"vinegar-braised-cabbage":{"title":"Kool met azijn","category":"Groenten","ingredients":["Kool: ongeveer 400 g","Knoflook: ongeveer 10 g","Gedroogde chilipeper: ongeveer 5 g","Sichuanpeper: ongeveer 2 g, optioneel"],"seasonings":["Chinkiang-azijn: ongeveer 20 ml","Lichte sojasaus: ongeveer 10 ml","Suiker: ongeveer 5 g","Zout: ongeveer 3 g","Bakolie: ongeveer 25 ml"],"instructions":["Scheid de stronken van de bladeren; snijd de stronken schuin en scheur de bladeren in grote stukken.","Verhit olie in een pan, bak de Sichuanpeper op laag vuur tot die geurt en verwijder die daarna.","Voeg de gedroogde chilipeper en knoflook toe en bak kort tot ze geuren.","Zet het vuur hoog, roerbak de stronken ongeveer 1 minuut en voeg daarna de bladeren ongeveer 30 seconden toe.","Giet de azijn langs de rand van de pan en schep snel om.","Voeg sojasaus, suiker en zout toe, schep kort om en serveer direct."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen."],"improvements":["Niet vastgelegd. Openbare referentierecepten benadrukken dat je stronken en bladeren apart bereidt en snel op hoog vuur roerbakt om overtollig vocht te beperken en de kool knapperig te houden."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 15 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: SciCook — Vinegar Cabbage"]},"padron-peppers-tapas":{"title":"Tapas met Padrónpepers","category":"Groenten","ingredients":["Padrónpepers: ongeveer 500 g"],"seasonings":["Spaanse olijfolie: naar behoefte (een openbare referentie gebruikt ongeveer 300 ml)","Zeezoutvlokken: naar behoefte"],"instructions":["Was de Padrónpepers en laat ze goed uitlekken.","Verhit de olijfolie in een pan.","Voeg de pepers toe en bak ze tot de huid blaasjes vormt en goudbruin wordt.","Laat overtollige olie uitlekken, leg de pepers op een bord en bestrooi met zeezout. Serveer warm."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen.","Dit is een Spaans tapasgerecht."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 17 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: Foods and Wines from Spain — Padrón Peppers"]},"coca-cola-chicken-wings":{"title":"Kipvleugels met Coca-Cola","category":"Vlees","ingredients":["Kipvleugels: ongeveer 8","Coca-Cola met suiker: ongeveer 1 blikje"],"seasonings":["Zout: naar smaak","Shaoxing-wijn: ongeveer 1 el","Lichte sojasaus: ongeveer 10 ml","Donkere sojasaus: ongeveer 5–7 ml","Gember: ongeveer 5 plakjes","Kaneel: ½–1 stokje, optioneel","Steranijs: optioneel"],"instructions":["Snijd of prik beide kanten van de vleugels in zodat ze smaak opnemen; marineer ze desgewenst 30 minuten tot 2 uur met kookwijn en donkere sojasaus.","Begin de vleugels in koud water met gember; breng aan de kook, schep het schuim eraf, spoel met warm water en dep droog.","Bak de vleugels op laag vuur in de pan tot beide kanten goudbruin zijn.","Voeg Coca-Cola, kookwijn, lichte en donkere sojasaus en de optionele specerijen toe; de vloeistof moet de vleugels bijna bedekken.","Laat op laag vuur sudderen tot de vleugels gaar zijn en de vloeistof is ingekookt.","Zet het vuur hoger om de saus in te koken tot die aan de vleugels kleeft; voeg zo nodig zout toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 25 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: Xiachufang — Coca-Cola Chicken Wings","Referentieoverzicht: Wikipedia — Coca-Cola Chicken Wings"]},"fish-vinaigrette":{"title":"Salade met zalm, ei en gemengde sla met visvinaigrette","category":"Salades","ingredients":["Gemengde sla: 2–3 royale handen","Gegaarde zalm: 1 filet, ongeveer 120–150 g","Hardgekookte eieren: 2","Cherrytomaten: 8–10","Avocado: ½","Optioneel feta of een andere milde witte kaas","Optioneel zwarte sesam"],"seasonings":["Extra vierge olijfolie: 3 delen","Azijn: 1 deel","Zout: naar smaak","Peper: naar smaak","Italiaanse kruiden: naar smaak"],"instructions":["Maak de vinaigrette: doe de olijfolie, azijn, zout, peper en Italiaanse kruiden in een klein doorzichtig bakje met een goed sluitend deksel. Sluit het stevig en schud tot alles gemengd is.","Stel de salade samen: verdeel de sla over een grote schaal, voeg de tomaten en avocado toe en leg de zalm en eieren erbovenop.","Werk af: voeg de optionele kaas en zwarte sesam toe, schud de vinaigrette opnieuw, sprenkel die over de salade en serveer direct."],"experience":["Ik heb dit gerecht gemaakt en twee foto's van het eindresultaat genomen."],"notes":["Beide foto's horen bij deze zalmsalade. De exacte bereidingsdatum is niet vastgelegd."]},"honey-mustard-chicken-salad-sauce":{"title":"Kipsalade met honing-mosterdressing","category":"Salades","ingredients":["Dun gesneden kipfilet: 120 g","Gemengde sla: 2–3 royale handen","Hardgekookte eieren: 2","Cherrytomaten: 8–10","Avocado: ½","Een kleine hand grof gehakte noten","Optioneel feta of een andere milde witte kaas","Optioneel zwarte sesam"],"seasonings":["Extra vierge olijfolie: 1 el (15 ml)","Dijonmosterd: 1 el (15 g), of 2 tl Dijon plus 1 tl grove mosterd","Honing: 2 tl (10 ml)","Appelazijn of vers citroensap: 1 tl (5 ml)","Fijn zeezout: 1 snufje","Versgemalen zwarte peper: 1 snufje","Optioneel knoflookpoeder of verse bieslook"],"instructions":["Bereid de kip: kruid rauwe kip, gaar die volledig, laat kort rusten en snijd dun; kant-en-klare kipfiletreepjes kunnen direct worden gebruikt.","Meng de basis: klop de mosterd, honing, azijn of citroensap, zout en peper glad.","Emulgeer de olie: schenk de olijfolie langzaam erbij terwijl je stevig klopt, tot de dressing glanzend en iets dikker is.","Pas de dikte aan: klop ½ tl warm water erdoor als een dunnere dressing gewenst is.","Stel de salade samen: doe de sla, tomaten en avocado in een kom en leg de eieren, kip, noten en optionele toppings erop.","Maak af: meng de helft van de dressing door de kip en sprenkel de rest vlak voor het serveren over de sla."],"notes":["Dit levert ongeveer 2½ el dressing voor 120 g kip. Bij rauwe kip kan 1 el dressing op laag vuur 30–45 seconden in de pan worden toegevoegd om de kip licht te glaceren; gebruik de rest koud over de salade.","Dit recept staat voorlopig op de lijst 'willen proberen'; er is nog geen bereidingsdatum, ervaring of persoonlijke foto vastgelegd."]}},"photos":{"hand-torn-cabbage-2026-10-12.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"hand-torn-cabbage-2026-10-29.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"garlic-oyster-sauce-pak-choi-2026-10-25.jpg":{"identifiedAs":"Paksoi met knoflook en oestersaus","note":"Betrouwbaar gekoppeld aan dit recept."},"stir-fried-cabbage-vegetable-review-2026-10-15.jpg":{"identifiedAs":"Kool met azijn","note":"Door de gebruiker bevestigd als kool met azijn."},"pan-fried-green-peppers-review-2026-10-17.jpg":{"identifiedAs":"Tapas met Padrónpepers","note":"Door de gebruiker bevestigd als Spaanse tapas met Padrónpepers."},"soy-glazed-chicken-review-2026-10-25.jpg":{"identifiedAs":"Kipvleugels met Coca-Cola","note":"Door de gebruiker bevestigd als kipvleugels met Coca-Cola."},"fish-vinaigrette-1.jpg":{"date":"Niet vastgelegd","identifiedAs":"Salade met zalm, ei en gemengde sla","note":"Een persoonlijke kookfoto die bij het recept voor visvinaigrette is aangeleverd."},"fish-vinaigrette-2.jpg":{"date":"Niet vastgelegd","identifiedAs":"Salade met zalm, ei en gemengde sla","note":"Een persoonlijke kookfoto die bij het recept voor visvinaigrette is aangeleverd."}}}}}</script>
</head>
<body>
  <div id="app"></div>
  <script>
(() => {
  'use strict';

  const { recipes, photos, translations = {} } = JSON.parse(document.getElementById('cookbook-data').textContent);
  const app = document.getElementById('app');
  const storage = (() => { try { return window.localStorage; } catch { return null; } })();
  const supportedLocales = ['zh', 'en', 'nl'];
  const isLocale = value => supportedLocales.includes(value);
  const savedLocale = storage?.getItem('cooking-locale');
  const requestedLocale = typeof URLSearchParams !== 'undefined' ? new URLSearchParams(location.search || '').get('lang') : null;
  const browserLanguage = typeof navigator !== 'undefined' ? String(navigator.language || '').toLowerCase() : '';
  const detectedLocale = browserLanguage.startsWith('nl') ? 'nl' : browserLanguage.startsWith('en') ? 'en' : 'zh';
  const initialLocale = isLocale(requestedLocale) ? requestedLocale : isLocale(savedLocale) ? savedLocale : detectedLocale;
  const state = { query: '', category: '全部', tag: '全部', status: 'cooked', locale: initialLocale };
  const categories = ['全部', '海鲜', '蔬菜', '鸡蛋', '汤', '肉类', '沙拉'];
  const matchedCount = photos.filter(p => p.matchStatus === 'matched').length;
  const reviewCount = photos.filter(p => p.matchStatus === 'review').length;
  const cookedCount = recipes.filter(r => r.status === 'cooked').length;
  const tags = [...new Set(recipes.flatMap(r => r.tags))].sort();
  const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
  const back = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg>';
  const searchIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16.2 16.2 5 5"/></svg>';
  const photoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.65"/><path d="m4 17 5.5-5 3.5 3 2.5-2 4.5 5"/></svg>';
  const bookIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2.6-1.6-5.6-1.7-9-1v13c3.3-.6 6.4-.5 9 1 2.6-1.5 5.7-1.6 9-1V5c-3.4-.7-6.4-.6-9 1Z"/><path d="M12 6v13"/></svg>';
  const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z"/><path d="M12 7v5l3.5 2"/></svg>';

  const englishUI = translations.ui?.en || {};
  const dutchUI = translations.nl?.ui || {};
  function currentUI() {
    return state.locale === 'en' ? englishUI : state.locale === 'nl' ? dutchUI : {};
  }
  function currentRecipeTranslation(recipe) {
    return state.locale === 'en'
      ? (translations.recipes?.[recipe.id] || {})
      : state.locale === 'nl'
        ? (translations.nl?.recipes?.[recipe.id] || {})
        : {};
  }
  function currentPhotoTranslation(photo) {
    return state.locale === 'en'
      ? (translations.photos?.[photo.displayFile] || {})
      : state.locale === 'nl'
        ? (translations.nl?.photos?.[photo.displayFile] || {})
        : {};
  }
  function t(key, fallback, values = {}) {
    const ui = currentUI();
    let text = state.locale === 'zh' ? fallback : (ui[key] || fallback);
    Object.entries(values).forEach(([name, value]) => { text = text.replaceAll('{' + name + '}', String(value)); });
    return text;
  }
  function categoryLabel(category) {
    return state.locale === 'zh' ? category : (currentUI().categories?.[category] || category);
  }
  function tagLabel(tag) {
    return state.locale === 'zh' ? tag : (currentUI().tags?.[tag] || tag);
  }
  function localizedRecipe(recipe) {
    const tr = currentRecipeTranslation(recipe);
    const localized = { ...recipe };
    ['title', 'category', 'ingredients', 'seasonings', 'instructions', 'experience', 'improvements', 'nextSeasonings', 'notes', 'sources'].forEach(key => {
      if (tr[key] !== undefined) localized[key] = tr[key];
    });
    return localized;
  }
  function localizedPhoto(photo) {
    const tr = currentPhotoTranslation(photo);
    return { ...photo, ...tr };
  }
  function setLocale(locale) {
    state.locale = isLocale(locale) ? locale : 'zh';
    storage?.setItem('cooking-locale', state.locale);
    if (typeof URLSearchParams !== 'undefined' && location.search && new URLSearchParams(location.search).has('lang') && typeof history !== 'undefined' && history.replaceState) {
      const params = new URLSearchParams(location.search);
      params.delete('lang');
      const query = params.toString();
      history.replaceState({}, '', location.pathname + (query ? '?' + query : '') + location.hash);
    }
    render();
  }

  function route() {
    const path = decodeURIComponent(location.hash.replace(/^#/, '') || '/');
    if (path === '/photos') return { type: 'photos' };
    if (path.startsWith('/recipe/')) return { type: 'recipe', id: path.slice('/recipe/'.length) };
    return { type: 'home' };
  }

  function header(current) {
    return `<header class="site-header">
      <div class="header-inner layout-container">
        <a class="brand" href="#/" aria-label="${t('brandAria', '我的厨房笔记，返回首页')}">
          <span class="brand-title"><strong>${t('brand', '厨房笔记')}</strong><small>${t('brandSubtitle', 'THE COOKING JOURNAL')}</small></span>
        </a>
        <nav class="main-nav" aria-label="${t('mainNavAria', '主导航')}">
          <a href="#/" ${current === 'home' ? 'aria-current="page"' : ''}>${t('recipes', '菜谱')} <span class="nav-count">${cookedCount}</span></a>
          <a href="#/photos" ${current === 'photos' ? 'aria-current="page"' : ''}>${t('photos', '照片档案')}</a>
        </nav>
        <select class="language-select" aria-label="${t('languageAria', '选择语言')}">
          <option value="zh" ${state.locale === 'zh' ? 'selected' : ''}>${t('languageChinese', '中文')}</option>
          <option value="en" ${state.locale === 'en' ? 'selected' : ''}>${t('languageEnglish', 'English')}</option>
          <option value="nl" ${state.locale === 'nl' ? 'selected' : ''}>${t('languageDutch', 'Nederlands')}</option>
        </select>
        <div class="header-side"><span class="header-star">✳</span> ${t('headerSide', 'KEEP THE GOOD BITS')}</div>
      </div>
    </header>`;
  }

  function footer() {
    return `<footer class="site-footer"><div class="layout-container footer-inner">
      <div class="footer-brand">✳ <span>${t('brand', '厨房笔记')}</span></div>
      <span>${t('footerText', '记录真实做过的菜，也记录不那么成功的尝试。')}</span>
      <span>${t('footerArchive', 'PERSONAL COOKING ARCHIVE')}</span>
    </div></footer>`;
  }

  function photoVisual(photo, mode = '') {
    const cls = mode === 'card' ? 'visual-card' : mode === 'album' ? 'visual-album' : 'visual-detail';
    if (photo?.available) {
      return `<div class="photo-frame ${cls}"><img loading="lazy" src="${escape(photo.publicPath)}" alt="${escape(photo.identifiedAs)} ${t('cookingPhotoAlt', '的烹饪照片')}"/></div>`;
    }
    const hasRecord = Boolean(photo);
    return `<div class="photo-frame photo-missing ${cls}" aria-label="${hasRecord ? t('photoPending', '照片文件尚未上传') : t('noLinkedPhoto', '暂未关联照片')}">
      <span class="photo-corner">${hasRecord ? t('photoReference', 'PHOTO REFERENCE') : t('noPhotoLabel', 'NO PHOTO')}</span>
      <div class="placeholder-plate"><div class="placeholder-inner">${photoIcon}</div></div>
      <span class="placeholder-text">${hasRecord ? t('photoPending', '照片文件待添加') : t('noLinkedPhoto', '尚无关联照片')}</span>
      ${hasRecord ? `<span class="placeholder-filename">${escape(photo.displayFile)}</span>` : `<span class="placeholder-filename">${t('spaceLater', 'A LITTLE SPACE FOR LATER')}</span>`}
    </div>`;
  }

  function chip(tag, cls = '') { return `<span class="tag ${cls}">${escape(tag)}</span>`; }

  function referenceVisual(url, title, mode = '') {
    const cls = mode === 'card' ? 'visual-card' : mode === 'album' ? 'visual-album' : 'visual-detail';
    return '<div class="photo-frame ' + cls + ' photo-reference"><img loading="lazy" referrerpolicy="no-referrer" src="' + escape(url) + '" alt="' + escape(title) + ' ' + t('webReferenceAlt', '的网络参考图') + '"/><span class="photo-corner">' + t('webBadge', 'WEB REFERENCE') + '</span></div>';
  }

  function recipeCard(recipe, index) {
    const display = localizedRecipe(recipe);
    const photo = recipe.photos[0] || null;
    const reference = !photo && recipe.referenceImage ? recipe.referenceImage : null;
    const visual = photo ? photoVisual(localizedPhoto(photo), 'card') : reference ? referenceVisual(reference, display.title, 'card') : photoVisual(null, 'card');
    return `<a class="recipe-card" href="#/recipe/${encodeURIComponent(recipe.id)}" style="--card-index:${index}">
      <div class="card-cover cover-${escape(recipe.category)}">
        ${visual}
        <span class="card-number">${String(index + 1).padStart(2,'0')} / ${String(cookedCount).padStart(2,'0')}</span>
      </div>
      <div class="card-content">
        <div class="card-meta"><span class="dot"></span>${escape(display.category)}<span class="meta-divider">/</span>${recipe.status === 'cooked' ? t('statusCooked', '已做过') : t('statusTry', '想试试')}</div>
        <div class="card-title-row"><h3>${escape(display.title)}</h3><span class="card-arrow">${arrow}</span></div>
        <p class="card-ingredients">${escape(display.ingredients.length ? display.ingredients.join(' · ') : t('noIngredients', '食材尚未记录'))}</p>
        <div class="card-bottom"><span class="card-photo-status">${photo ? (photo.available ? t('photoMy', '● 有实拍照片') : t('photoLinked', '◌ 照片已关联')) : reference ? t('webReference', '◎ 网络参考图') : t('noPhoto', '— 暂无照片')}</span><span>${escape(display.tags.slice(0, 2).map(tagLabel).join(' / '))}</span></div>
      </div>
    </a>`;
  }

  function hero() {
    return `<section class="hero layout-container">
      <div class="hero-copy">
        <div class="eyebrow"><span class="eyebrow-line"></span> ${t('heroEyebrow', 'A PERSONAL COOKING ARCHIVE')} <span class="edition">${t('heroEdition', 'VOL. 01')}</span></div>
        <h1>${state.locale === 'zh' ? '把每一次下厨，' : t('heroTitle1', 'Take every time you cook')}<br/><em>${state.locale === 'zh' ? '都认真记下来。' : t('heroTitle2', 'seriously enough to remember.')}</em></h1>
        <p class="hero-description">${t('heroDescription', '不只是好吃的做法，也收藏失败的原因、下一次的想法，还有那些值得留下的厨房小发现。')}</p>
        <a class="hero-link" href="#recipes"><span>${t('heroLink', '翻看我的菜谱')}</span><span class="hero-link-icon">${arrow}</span></a>
      </div>
      <div class="hero-art" role="img" aria-label="${t('heroAria', '抽象装饰图案：厨房笔记与盘子，不代表实际菜肴照片')}">
        <div class="art-top">${t('artJournal', 'THE<br/>COOKING<br/>JOURNAL')} <span>✳</span></div>
        <div class="art-plate"><div class="art-plate-ring"><span>${t('artGoodFood', 'GOOD FOOD')}<br/>${t('artGoodNotes', 'GOOD NOTES')}</span></div></div>
        <div class="art-bottom"><span>${t('artCollected', 'COLLECTED WITH CARE')}</span><span>${t('artEst', 'EST. 2026')}</span></div>
      </div>
    </section>`;
  }

  function stats() {
    return `<section class="stats-strip layout-container" aria-label="${t('statsAria', '菜谱统计')}">
      <div class="stat"><strong>${String(cookedCount).padStart(2, '0')}</strong><span>${t('statsCooked', '做过的菜谱')}<small>${t('statsCookedMeta', 'COOKED RECIPES')}</small></span></div>
      <div class="stat"><strong>${String(matchedCount).padStart(2, '0')}</strong><span>${t('statsMatched', '已匹配照片')}<small>${t('statsMatchedMeta', 'MATCHED REFERENCES')}</small></span></div>
      <div class="stat"><strong>${String(reviewCount).padStart(2, '0')}</strong><span>${t('statsReview', '待确认照片')}<small>${t('statsReviewMeta', 'NEEDS REVIEW')}</small></span></div>
      <div class="stat stat-note"><span>${t('statsNote1', '值得记录的，不只是')}<br/>${t('statsNote2', '成功的那一顿。')}</span><i>✳</i></div>
    </section>`;
  }

  function filters() {
    return `<div class="toolbar">
      <div class="search-wrap">${searchIcon}<input id="recipe-search" type="search" placeholder="${t('searchPlaceholder', '搜索菜名、食材或标签…')}" autocomplete="off" aria-label="${t('searchAria', '搜索菜名或食材')}" value="${escape(state.query)}" />
        ${state.query ? `<button class="clear-search" type="button" aria-label="${t('clearSearch', '清除搜索')}">×</button>` : ''}
      </div>
      <div class="filter-title">${t('browseCategory', '按类别浏览')} <span>${t('filterCategoryMeta', 'FILTER BY CATEGORY')}</span></div>
      <div class="category-row" role="group" aria-label="${t('categoryAria', '菜谱类别')}">${categories.map(cat => `<button type="button" class="category-button ${state.category === cat ? 'active' : ''}" data-category="${escape(cat)}" aria-pressed="${state.category === cat}">${escape(categoryLabel(cat))}</button>`).join('')}</div>
      <div class="filter-title tag-title">${t('browseTag', '按标签浏览')} <span>${t('filterTagMeta', 'FILTER BY TAG')}</span></div>
      <div class="tag-row" role="group" aria-label="${t('tagAria', '标签筛选')}">${['全部', ...tags].map(tag => `<button type="button" class="tag-button ${state.tag === tag ? 'active' : ''}" data-tag="${escape(tag)}" aria-pressed="${state.tag === tag}">${escape(tag === '全部' ? t('all', '全部') : tagLabel(tag))}</button>`).join('')}</div>
    </div>`;
  }

  function getFiltered() {
    const q = state.query.trim().toLocaleLowerCase();
    return recipes.filter(r => r.status === state.status)
      .filter(r => state.category === '全部' || r.category === state.category)
      .filter(r => state.tag === '全部' || r.tags.includes(state.tag))
      .filter(r => !q || [r.title, r.category, r.cuisine, ...r.tags, ...r.ingredients, ...r.seasonings].join(' ').toLocaleLowerCase().includes(q));
  }

  function galleryResults() {
    const results = getFiltered();
    const resultLabel = state.status === 'to-try'
      ? t('resultsToTry', '共找到 {count} 道想尝试的菜谱', { count: results.length })
      : t('resultsFound', '共找到 {count} 道菜谱', { count: results.length });
    const hasFilters = state.query || state.category !== '全部' || state.tag !== '全部';
    const emptyTitle = state.status === 'to-try' ? t('emptyToTryTitle', '想做的清单还是空的') : t('emptyTitle', '没有找到对应菜谱');
    const emptyText = state.status === 'to-try' ? t('emptyToTryText', '目前还没有记录 to-try 菜谱。以后可以把想尝试的菜加进 Markdown。') : t('emptyText', '可以换个关键词，或者清除类别和标签筛选。');
    return `<div class="results-heading"><span>${escape(resultLabel)}</span>
      ${hasFilters ? `<button class="reset-filter" type="button">${t('clearFilters', '清除筛选 ↗')}</button>` : `<span class="results-aside">${t('madeRemembered', 'MADE & REMEMBERED')}</span>`}</div>
      ${results.length ? `<div class="recipe-grid">${results.map(recipeCard).join('')}</div>` : `<div class="empty-results"><span class="empty-symbol">✳</span><h3>${emptyTitle}</h3><p>${emptyText}</p>${state.status !== 'to-try' ? `<button type="button" class="reset-filter btn-outline">${t('clearFilters', '清除筛选')}</button>` : ''}</div>`}`;
  }

  function home() {
    return `${stats()}
      <section class="catalog layout-container" id="recipes">
        <div class="section-heading"><div><span class="section-kicker">${t('recipesKicker', '01 / THE RECIPES')}</span><h2>${t('sectionRecipes', '我的菜谱收藏')}</h2><p>${t('sectionDescription', '每一道菜都有自己的小故事，和可以做得更好的地方。')}</p></div><span class="section-side">${t('fromKitchen', 'FROM MY KITCHEN')}<br/>${t('toPages', 'TO THESE PAGES')}</span></div>
        <div class="status-tabs" role="group" aria-label="${t('statusAria', '菜谱状态')}">
          <button type="button" class="status-button ${state.status === 'cooked' ? 'active' : ''}" data-status="cooked" aria-pressed="${state.status === 'cooked'}">${t('statusCooked', '已经做过')} <span>${cookedCount}</span></button>
          <button type="button" class="status-button ${state.status === 'to-try' ? 'active' : ''}" data-status="to-try" aria-pressed="${state.status === 'to-try'}">${t('statusTry', '想试试')} <span>${recipes.filter(r => r.status === 'to-try').length}</span></button>
        </div>
        <div id="filters">${filters()}</div>
        <div id="gallery-results" aria-live="polite">${galleryResults()}</div>
      </section>
      `;
  }

  function itemList(items, numbered = false) {
    if (!items?.length) return '<p class="not-recorded">' + t('notRecorded', '尚未记录') + '</p>';
    const tag = numbered ? 'ol' : 'ul';
    return `<${tag} class="detail-list ${numbered ? 'steps-list' : ''}">${items.map(item => `<li>${escape(item)}</li>`).join('')}</${tag}>`;
  }
  function detailSection(label, title, items, options = {}) {
    return `<section class="detail-section ${options.className || ''}"><div class="detail-section-head"><span class="tiny-index">${escape(label)}</span><h2>${escape(title)}</h2></div>${itemList(items, options.numbered)}</section>`;
  }

  function detail(recipe) {
    const display = localizedRecipe(recipe);
    const idx = recipes.findIndex(r => r.id === recipe.id) + 1;
    const cover = recipe.photos.find(p => p.available) || recipe.photos[0] || null;
    const reference = !cover && recipe.referenceImage ? recipe.referenceImage : null;
    const linkedLabel = `${recipe.photos.length} ${t('linked', '张已关联')}`;
    const extraTip = recipe.photos.length && !recipe.photos.some(p => p.available) ? t('photoPending', '目前尚未提供实际图片文件。') : '';
    return `<main class="detail-page layout-container">
      <div class="breadcrumbs"><a href="#/">${t('allRecipes', '全部菜谱')}</a><span>/</span><span>${escape(display.category)}</span><span>/</span><b>${escape(display.title)}</b></div>
      <div class="detail-top"><div class="detail-intro"><div class="detail-kicker">${t('recipeLabel', 'RECIPE')} ${String(idx).padStart(2, '0')} / ${String(recipes.length).padStart(2, '0')} <span class="detail-line"></span> ${escape(display.category)}</div>
        <h1>${escape(display.title)}</h1>
        <p>${t('recipeIntro', '记下做过的步骤、真实感受，以及下次还想改进的地方。')}</p>
        <div class="detail-tag-row">${recipe.tags.map(tag => chip(tagLabel(tag))).join('')}</div>
        <div class="detail-action-row"><span class="cooked-label"><span class="dot"></span> ${recipe.status === 'cooked' ? t('cooked', '实际做过') : t('statusTry', '想试试')}</span><button type="button" class="print-button">${t('print', '打印菜谱 ↗')}</button></div></div>
        <div class="detail-cover">${cover ? photoVisual(localizedPhoto(cover)) : reference ? referenceVisual(reference, display.title) : photoVisual(null)}</div>
      </div>
      <div class="detail-body">
        <aside class="detail-sidebar">${detailSection('01', t('mainIngredients', '主要食材'), display.ingredients)}${detailSection('02', t('seasonings', '调味料'), display.seasonings)}
          ${display.nextSeasonings?.length ? `<section class="sidebar-next"><div class="mini-label">${t('forNext', 'FOR NEXT TIME')}</div><h3>${t('nextTitle', '下次参考调味比例')}</h3>${itemList(display.nextSeasonings)}<p>${t('nextNote', '这是下次参考建议，不代表上次实际用量。')}</p></section>` : ''}
          <div class="recipe-sourcefile">${bookIcon}<span>${t('markdownSource', '菜谱数据来自 Markdown')}<br/><small>${escape(recipe.filename)}</small></span></div>
        </aside>
        <div class="detail-primary">${detailSection('03', t('steps', '做法步骤'), display.instructions, {numbered:true})}
          <div class="experience-panels"><div class="experience-panel observed"><div class="panel-eyebrow"><span>↳</span> ${t('experienceEyebrow', 'WHAT ACTUALLY HAPPENED')}</div><h2>${t('experienceTitle', '我的实际经验')}</h2>${itemList(display.experience)}</div>
          <div class="experience-panel next"><div class="panel-eyebrow"><span>✳</span> ${t('improvementsEyebrow', 'NOTES FOR NEXT TIME')}</div><h2>${t('improvementsTitle', '下次可以改进')}</h2>${itemList(display.improvements)}</div></div>
          ${detailSection('04', t('otherNotes', '其他记录'), display.notes)}
          ${detailSection('05', t('sources', '参考来源'), display.sources)}
          <section class="detail-section detail-gallery"><div class="detail-section-head"><span class="tiny-index">06</span><h2>${t('relatedPhotos', '相关照片')} <span class="photo-count">${linkedLabel}</span></h2></div>
            ${recipe.photos.length ? `<div class="detail-photos">${recipe.photos.map(photo => { const displayPhoto = localizedPhoto(photo); return `<div class="detail-photo"><div>${photoVisual(displayPhoto, 'album')}</div><p>${escape(displayPhoto.originalFile)} <span>· ${escape(displayPhoto.date)}</span></p></div>`; }).join('')}</div>` : reference ? `<div class="detail-photos detail-reference-wrap">${referenceVisual(reference, display.title, 'album')}</div><p class="reference-photo-note">${t('referenceTip', '这是网络参考图，不是本人实拍照片。')}</p>` : `<p class="not-recorded">${t('noReliablePhoto', '尚未记录可靠匹配的照片')}</p>`}
            <p class="gallery-tip">${photoIcon} ${t('photoRules', '只有人工确认匹配的照片才会关联到菜谱。')}${extraTip}</p>
          </section>
        </div>
      </div>
      <div class="detail-bottom"><a href="#/">${back} ${t('backToList', '返回菜谱列表')}</a><a href="#/photos">${t('viewPhotoArchive', '查看照片档案')} ${arrow}</a></div>
    </main>`;
  }

  function photoCard(photo) {
    const display = localizedPhoto(photo);
    const confirmed = photo.matchStatus === 'matched';
    return `<article class="album-card ${confirmed ? '' : 'review-photo'}">
      ${photoVisual(display, 'album')}
      <div class="album-content"><div class="album-topline"><span class="album-status ${confirmed ? 'matched' : 'review'}">${confirmed ? t('photoConfirmed', '✓ 已可靠匹配') : t('photoReview', '◌ 待确认')}</span><span>${escape(display.date)}</span></div>
      <h3>${escape(display.identifiedAs)}</h3><p>${escape(display.note)}</p><div class="album-files"><span>${t('originalLabel', 'ORIGINAL')} <b>${escape(display.originalFile)}</b></span><span>${t('displayLabel', 'DISPLAY')} <b>${escape(display.displayFile)}</b></span></div>
      ${confirmed ? `<a class="album-recipe-link" href="#/recipe/${encodeURIComponent(photo.recipeId)}">${t('viewRecipe', '查看对应菜谱')} ${arrow}</a>` : `<span class="album-unassigned">${t('unassigned', '尚未归入任何正式菜谱')}</span>`}</div>
    </article>`;
  }

  function photosPage() {
    const matched = photos.filter(p => p.matchStatus === 'matched');
    const pending = photos.filter(p => p.matchStatus === 'review');
    const availableCount = photos.filter(p => p.available).length;
    const imageMessage = availableCount
      ? pending.length
        ? t('imageBannerWithPending', `已接入 ${availableCount} 张 JPEG 显示图片；原始 HEIC 保留在资料库中。待确认照片仍只作为审核记录展示，不会自动关联到菜谱。`, { count: availableCount })
        : t('imageBannerAllConfirmed', `已接入 ${availableCount} 张 JPEG 显示图片；原始 HEIC 保留在资料库中。当前照片均已根据用户确认关联到对应菜谱。`, { count: availableCount })
      : t('imageBannerNone', '目前只有照片文件名和审核记录，没有收到实际 HEIC 或 JPEG 图片。下方先保留照片位置；把真实 JPG 放入项目的 images/photos/ 文件夹并重新构建，图片即可显示。');
    return `<main class="album-page layout-container"><div class="breadcrumbs"><a href="#/">${t('home', '首页')}</a><span>/</span><b>${t('photos', '照片档案')}</b></div>
      <div class="page-intro"><span class="section-kicker">${t('photoArchiveKicker', '02 / PHOTO ARCHIVE')}</span><h1>${t('photoArchiveTitle', '镜头里的厨房。')}<span>✳</span></h1><p>${t('photoArchiveIntro1', '照片是回忆的一部分，但不是所有照片都能准确对应到某道菜。')}<br/>${t('photoArchiveIntro2', '已确认的归档，不能确认的先留着。')}</p></div>
      <div class="archive-banner"><span class="banner-icon">${photoIcon}</span><div><strong>${t('imageBannerTitle', '关于图片文件')}</strong><p>${imageMessage}</p></div></div>
      <section class="photo-group"><div class="photo-group-title"><div><span class="section-kicker">${t('confirmedKicker', '01 / CONFIRMED')}</span><h2>${t('confirmedTitle', '已可靠匹配')} <span>${matched.length}</span></h2></div><p>${t('confirmedSubtitle', '已确认属于现有菜谱')}</p></div><div class="album-grid">${matched.map(photoCard).join('')}</div></section>
      ${pending.length ? `<section class="photo-group"><div class="photo-group-title"><div><span class="section-kicker">${t('toReviewKicker', '02 / TO REVIEW')}</span><h2>${t('toReviewTitle', '待确认')} <span>${pending.length}</span></h2></div><p>${t('toReviewSubtitle', '保留可能性，不做未经确认的推断')}</p></div><div class="album-grid">${pending.map(photoCard).join('')}</div></section>` : ''}
    </main>`;
  }

  function shell(view, active) { return `${header(active)}${view}${footer()}`; }

  function updateGallery() {
    const target = document.getElementById('gallery-results');
    if (target) target.innerHTML = galleryResults();
  }
  function updateFilters() {
    const target = document.getElementById('filters');
    if (target) target.innerHTML = filters();
    updateGallery();
  }

  function attachEvents() {
    // Event delegation on stable containers ensures filters still work after a redraw.
    const filterRoot = document.getElementById('filters');
    filterRoot?.addEventListener('input', event => {
      if (event.target.id !== 'recipe-search') return;
      state.query = event.target.value;
      updateGallery();
      const clear = filterRoot.querySelector('.clear-search');
      if (state.query && !clear) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'clear-search'; b.textContent = '×';
        b.setAttribute('aria-label', t('clearSearch', '清除搜索'));
        event.target.parentElement.append(b);
      } else if (!state.query && clear) clear.remove();
    });
    filterRoot?.addEventListener('click', event => {
      const category = event.target.closest('[data-category]');
      if (category) { state.category = category.dataset.category; updateFilters(); return; }
      const tag = event.target.closest('[data-tag]');
      if (tag) { state.tag = tag.dataset.tag; updateFilters(); return; }
      if (event.target.closest('.clear-search')) {
        state.query = ''; updateFilters(); document.getElementById('recipe-search')?.focus();
      }
    });
    document.querySelector('.status-tabs')?.addEventListener('click', event => {
      const b = event.target.closest('[data-status]'); if (!b) return;
      state.status = b.dataset.status;
      document.querySelectorAll('[data-status]').forEach(el => {
        el.classList.toggle('active', el.dataset.status === state.status);
        el.setAttribute('aria-pressed', String(el.dataset.status === state.status));
      });
      updateGallery();
    });
    document.getElementById('gallery-results')?.addEventListener('click', event => {
      if (!event.target.closest('.reset-filter')) return;
      state.query = ''; state.category = '全部'; state.tag = '全部'; updateFilters();
    });
    document.querySelector('.print-button')?.addEventListener('click', () => window.print());
    document.querySelector('.language-select')?.addEventListener('change', event => {
      setLocale(event.target.value);
    });
  }

  function render() {
    const r = route();
    if (document.documentElement) {
      document.documentElement.lang = state.locale === 'en' ? 'en' : state.locale === 'nl' ? 'nl' : 'zh-CN';
      document.title = state.locale === 'en' ? 'Cooking Notes' : state.locale === 'nl' ? 'Kooknotities' : '我的厨房笔记 · Cooking Notes';
    }
    if (r.type === 'recipe') {
      const recipe = recipes.find(rec => rec.id === r.id);
      app.innerHTML = shell(recipe ? detail(recipe) : `<main class="layout-container not-found"><h1>${t('notFound', '没有找到这道菜')}</h1><a href="#/">${back} ${t('backToList', '返回列表')}</a></main>`, 'recipe');
    } else if (r.type === 'photos') app.innerHTML = shell(photosPage(), 'photos');
    else app.innerHTML = shell(home(), 'home');
    attachEvents();
    if (r.type === 'home' && location.hash === '#recipes') {
      requestAnimationFrame(() => document.getElementById('recipes')?.scrollIntoView());
    } else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
})();

</script>
  <noscript><div class="no-script">请启用 JavaScript 浏览菜谱。所有源内容保存在 recipes/cooked/ Markdown 文件中。</div></noscript>
</body>
</html>
