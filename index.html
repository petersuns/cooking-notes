"Tapas","vegetables":"Vegetables"}}},"recipes":{"garlic-shrimp":{"title":"Garlic Shrimp","category":"Seafood","ingredients":["Frozen peeled shrimp","Garlic","Dried chili"],"seasonings":["Light soy sauce","Oyster sauce","Sugar"],"instructions":["Defrost the shrimp, drain them, and pat away excess moisture.","Mince the garlic and cut the dried chili into pieces; remove the seeds if desired.","Gently fry the garlic and dried chili in oil over low heat until fragrant.","Add the shrimp and stir-fry until fully cooked.","Add light soy sauce, oyster sauce, and a little sugar; toss to combine."],"experience":["I have cooked this dish.","Removing the seeds from dried chili reduces the heat.","Do not burn the garlic or dried chili, or they will taste bitter.","Drain frozen shrimp as thoroughly as possible."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: The Kitchn — Garlic Butter Shrimp"]},"blanched-iceberg-lettuce":{"title":"Blanched Iceberg Lettuce","category":"Vegetables","ingredients":["Iceberg lettuce"],"seasonings":["Garlic","Oyster sauce","Light soy sauce","Sugar","Oil"],"instructions":["Wash the lettuce and tear it into suitable pieces.","Briefly blanch it in boiling water.","Drain thoroughly.","Make a sauce with garlic, light soy sauce, oyster sauce, sugar, and a little water.","Pour the sauce over the lettuce."],"experience":["I have made it and thought it was delicious."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: DelishHomeCook — Iceberg Lettuce with Oyster Sauce"]},"garlic-oyster-sauce-pak-choi":{"title":"Garlic Oyster Sauce Pak Choi","category":"Vegetables","ingredients":["A reference recipe for about 2 pak choi","Pak choi: about 2 heads","Garlic: 2 cloves","Red chili: ½–1"],"seasonings":["Oyster sauce: 1 tbsp","Light soy sauce: 1 tsp","Dark soy sauce: a little, optional","Sesame oil: ½ tsp","Cornstarch: ¼ tsp or less","Water: about 3 tbsp, adjust as needed"],"instructions":["Wash the pak choi and cut each head in half or into quarters.","Place the stems in boiling water for about 10–15 seconds, then add the leaves and blanch briefly.","Drain thoroughly.","Heat oil in a pan and fry the garlic and red chili until fragrant.","Add the pre-mixed sauce and simmer briefly until slightly thickened.","Pour the sauce over the pak choi."],"experience":["I made this dish and took photos.","The leaves were a little too soft last time.","The sauce was too thick and there was slightly too much of it."],"improvements":["Shorten the blanching time.","Use less cornstarch or add a little more water.","There is no need to pour on so much sauce."],"sources":["Khin's Kitchen — Pak Choi with Garlic Sauce (source URL not recorded)"]},"tomato-and-eggs":{"title":"Tomato and Scrambled Eggs","category":"Eggs","ingredients":["Tomatoes","Eggs"],"seasonings":["Salt","Sugar","Oil"],"instructions":["Beat the eggs, stir-fry until just set, and remove from the pan.","Cut the tomatoes into chunks and stir-fry with salt until softened.","Press some of the tomato pieces to help release their juices.","Return the cooked eggs to the pan.","Adjust the flavor with sugar and salt."],"experience":["I have cooked this dish, but the last attempt was not very successful.","The tomatoes available in the UK were quite firm.","They stayed in chunks after cooking and released very little juice.","After adding water, the finished dish still became rather dry."],"improvements":["Buy ripe, softer tomatoes.","Cook the tomatoes separately for 4–6 minutes.","Cover the pan and braise briefly if needed.","Add a little tomato paste to help create more sauce when necessary."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: iCook — Tomato and Egg Stir-Fry"]},"hand-torn-cabbage":{"title":"Stir-Fried Hand-Torn Cabbage","category":"Vegetables","ingredients":["Sweetheart cabbage","Garlic","Dried chili"],"nextSeasonings":["Light soy sauce: 2 tsp","Vinegar: 1 tsp","Sugar: ¼–½ tsp"],"instructions":["Tear the cabbage into pieces, wash it, and drain thoroughly.","Mince the garlic and cut the dried chili into pieces.","Preheat the pan thoroughly and add oil.","Briefly fry the garlic and dried chili until fragrant.","Add the thicker stems first, followed by the leaves.","Stir-fry quickly over high heat.","Add light soy sauce, vinegar, and sugar at the end."],"experience":["I cooked it, but the last attempt was not ideal.","It was stir-fried for about 5 minutes.","The cabbage was tender but lacked wok-charred aroma.","There was some water at the bottom of the plate.","About 1 tbsp of vinegar may have been too much."],"improvements":["Drain the cabbage thoroughly after washing.","Make the pan hotter.","Cook in batches if there is too much cabbage.","Stir less frequently.","Try shortening the cooking time to about 2–3 minutes.","Start with 1 tsp vinegar."]},"pressure-cooker-chicken-soup":{"title":"Pressure Cooker Chicken Soup","category":"Soup","ingredients":["Chicken","Water"],"instructions":["Put the chicken in the pressure cooker.","Add water.","Cook the soup in the pressure cooker. About one hour was mentioned previously, but the exact pressure-cooking time and setting have not been confirmed."],"experience":["I have made this dish.","The seasonings, amount of chicken, and pressure-cooking time have not been recorded; these can be added next time."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: Wikimedia Commons — Chinese Food - Chicken Soup (CC BY-SA 3.0)"]},"soy-sauce-lamb-ribs":{"title":"Soy Sauce Lamb Ribs","category":"Meat","ingredients":["Lamb ribs"],"seasonings":["Soy sauce","Other seasonings not recorded"],"experience":["I have made this dish.","It was an improvised soy-sauce-style dish rather than a strict Chinese recipe."],"notes":["The image above is a web reference image, not a personal cooking photo; it shows a similar braised lamb-rib style rather than the actual finished dish."],"sources":["Web reference image: Sohu — Braised Lamb Ribs"]},"vinegar-braised-cabbage":{"title":"Vinegar-Fried Cabbage","category":"Vegetables","ingredients":["Cabbage: about 400 g","Garlic: about 10 g","Dried chili: about 5 g","Sichuan peppercorns: about 2 g, optional"],"seasonings":["Chinkiang vinegar: about 20 ml","Light soy sauce: about 10 ml","Sugar: about 5 g","Salt: about 3 g","Cooking oil: about 25 ml"],"instructions":["Separate the cabbage stems from the leaves; slice the stems diagonally and tear the leaves into large pieces.","Heat oil in a pan, fry the Sichuan peppercorns over low heat until fragrant, then remove them.","Add the dried chili and garlic and fry briefly until fragrant.","Turn the heat high, stir-fry the stems for about 1 minute, then add the leaves for about 30 seconds.","Pour the vinegar around the edge of the pan and toss quickly.","Add the soy sauce, sugar, and salt; toss briefly and serve immediately."],"experience":["I have made this dish and took a photo."],"improvements":["Not recorded. Public reference recipes emphasize separating stems and leaves and stir-frying quickly over high heat to reduce excess water and preserve crunch."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 15 October 2026 photo."],"sources":["Reference recipe: SciCook — Vinegar Cabbage"]},"padron-peppers-tapas":{"title":"Padrón Peppers Tapas","category":"Vegetables","ingredients":["Padrón peppers: about 500 g"],"seasonings":["Spanish olive oil: as needed (one public reference uses about 300 ml)","Sea-salt flakes: as needed"],"instructions":["Wash the Padrón peppers and drain them thoroughly.","Heat the olive oil in a pan.","Add the peppers and fry until the skins blister and turn golden.","Drain off excess oil, arrange on a plate, and sprinkle with sea salt. Serve hot."],"experience":["I have made this dish and took a photo.","This is a Spanish tapas dish."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 17 October 2026 photo."],"sources":["Reference recipe: Foods and Wines from Spain — Padrón Peppers"]},"coca-cola-chicken-wings":{"title":"Coca-Cola Chicken Wings","category":"Meat","ingredients":["Chicken wings: about 8","Sugared Coca-Cola: about 1 can"],"seasonings":["Salt: to taste","Shaoxing wine: about 1 tbsp","Light soy sauce: about 10 ml","Dark soy sauce: about 5–7 ml","Ginger: about 5 slices","Cinnamon: ½–1 stick, optional","Star anise: optional"],"instructions":["Score or pierce both sides of the wings to help them absorb flavor; marinate with cooking wine and dark soy sauce for about 30 minutes to 2 hours if desired.","Start the wings in cold water with ginger; bring to a boil, skim the foam, rinse with warm water, and pat dry.","Pan-fry the wings over low heat until golden on both sides.","Add the Coca-Cola, cooking wine, light soy sauce, dark soy sauce, and optional spices; the liquid should nearly cover the wings.","Simmer over low heat until the wings are cooked and the liquid has reduced.","Turn up the heat to reduce the sauce until it coats the wings; adjust with salt if needed."],"experience":["I have made this dish and took a photo."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 25 October 2026 photo."],"sources":["Reference recipe: Xiachufang — Coca-Cola Chicken Wings","Reference overview: Wikipedia — Coca-Cola Chicken Wings"]}},"photos":{"hand-torn-cabbage-2026-10-12.jpg":{"identifiedAs":"Hand-torn cabbage","note":"A reliable match for hand-torn cabbage; the photo alone cannot show which attempt it was."},"hand-torn-cabbage-2026-10-29.jpg":{"identifiedAs":"Hand-torn cabbage","note":"A reliable match for hand-torn cabbage; the photo alone cannot show which attempt it was."},"garlic-
