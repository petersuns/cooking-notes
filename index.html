","Gedroogde chilipeper"],"seasonings":["Lichte sojasaus","Oestersaus","Suiker"],"instructions":["Ontdooi de garnalen, laat ze uitlekken en dep overtollig vocht weg.","Hak de knoflook fijn en knip de gedroogde chilipeper in stukjes; verwijder eventueel de zaadjes.","Bak de knoflook en gedroogde chilipeper op laag vuur in olie tot ze geuren.","Voeg de garnalen toe en roerbak tot ze helemaal gaar zijn.","Voeg lichte sojasaus, oestersaus en een beetje suiker toe en schep alles om."],"experience":["Ik heb dit gerecht gemaakt.","Door de zaadjes uit de gedroogde chilipeper te verwijderen, wordt het minder pittig.","Laat de knoflook en chilipeper niet aanbranden, anders worden ze bitter.","Laat diepvriesgarnalen zo goed mogelijk uitlekken."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: The Kitchn — Garlic Butter Shrimp"]},"blanched-iceberg-lettuce":{"title":"Geblancheerde ijsbergsla (Kantonese stijl)","category":"Groenten","ingredients":["IJsbergsla: ½ krop, voor 1–2 personen","Knoflook: 2–3 teentjes","Water: ongeveer 1–1,5 liter om te blancheren"],"seasonings":["Oestersaus: 1 el (15 ml)","Lichte sojasaus: 1 el (15 ml)","Suiker: ½ tl","Bakolie: 1 el voor de knoflooksaus","Zout: ½ tl voor het blancheerwater","Bakolie: ½ tl voor het blancheerwater"],"instructions":["Bereid de sla: scheur ½ krop ijsbergsla in grote bladeren, was ze en laat ze goed uitlekken. Scheur de stukken niet te klein, anders worden ze na het blancheren te zacht. Hak de knoflook fijn.","Maak de oestersaus: meng 1 el oestersaus, 1 el lichte sojasaus, ½ tl suiker en 2 el water in een kommetje.","Blancheer de sla: breng ongeveer 1–1,5 liter water krachtig aan de kook en voeg ½ tl zout en ½ tl olie toe. Voeg de sla toe en blancheer ijsbergsla slechts 10–20 seconden. De sla moet iets zachter worden maar knapperig blijven. Schep de sla er meteen uit, laat goed uitlekken en spoel niet met koud water.","Maak de knoflook-oestersaus: verhit 1 el olie op middellaag vuur. Bak de knoflook ongeveer 15–25 seconden tot die geurt en voeg dan de saus toe. Laat de saus net tegen de kook aan komen en kook nog 15–20 seconden. Laat de knoflook niet aanbranden, anders wordt die bitter.","Giet de hete knoflook-oestersaus gelijkmatig over de sla en serveer meteen."],"experience":["Ik heb dit gerecht gemaakt en vond het erg lekker."],"notes":["IJsbergsla is knapperiger en bevat meer water dan de sla die in Guangdong vaak wordt gebruikt. Blancheer daarom kort; 10–20 seconden is meestal genoeg.","Laat de sla goed uitlekken, zodat de oestersaus niet verdund wordt.","Oestersaus en lichte sojasaus bevatten al zout, dus extra zout is meestal niet nodig in de saus.","Little Gem is in Londen ook het proberen waard, omdat de dikkere bladeren na het blancheren beter hun vorm behouden. IJsbergsla werkt goed als je die al in huis hebt.","De afbeelding is een persoonlijke foto van het eindresultaat die door de gebruiker is aangeleverd; de kookdatum is niet vastgelegd."],"sources":["Door de gebruiker aangeleverd thuisrecept; persoonlijke foto door de gebruiker aangeleverd."]},"garlic-oyster-sauce-pak-choi":{"title":"Paksoi met knoflook en oestersaus","category":"Groenten","ingredients":["Referentierecept voor ongeveer 2 paksoi","Paksoi: ongeveer 2 kroppen","Knoflook: 2 teentjes","Rode chilipeper: ½–1"],"seasonings":["Oestersaus: 1 el","Lichte sojasaus: 1 tl","Donkere sojasaus: een beetje, optioneel","Sesamolie: ½ tl","Maïzena: ¼ tl of minder","Water: ongeveer 3 el, naar behoefte"],"instructions":["Was de paksoi en snijd elke krop doormidden of in vieren.","Leg de stronken ongeveer 10–15 seconden in kokend water en voeg daarna de bladeren toe; blancheer kort.","Laat goed uitlekken.","Verhit olie in een pan en bak de knoflook en rode chilipeper tot ze geuren.","Voeg de vooraf gemengde saus toe en laat kort koken tot die iets dikker wordt.","Giet de saus over de paksoi."],"experience":["Ik heb dit gerecht gemaakt en foto's genomen.","De bladeren waren de vorige keer iets te zacht.","De saus was te dik en er was iets te veel van."],"improvements":["Blancheer de paksoi korter.","Gebruik minder maïzena of voeg wat meer water toe.","Het is niet nodig om zoveel saus over de paksoi te gieten."],"sources":["Khin's Kitchen — Pak Choi with Garlic Sauce (bron-URL niet vastgelegd)"]},"tomato-and-eggs":{"title":"Roergebakken tomaat met ei","category":"Eieren","ingredients":["Tomaten","Eieren"],"seasonings":["Zout","Suiker","Olie"],"instructions":["Klop de eieren los, roerbak ze tot ze net gestold zijn en haal ze uit de pan.","Snijd de tomaten in stukken en roerbak ze met zout tot ze zacht worden.","Druk enkele tomaatstukken plat zodat ze hun sap loslaten.","Doe de gebakken eieren terug in de pan.","Breng op smaak met suiker en zout."],"experience":["Ik heb dit gerecht gemaakt, maar de vorige poging was niet erg geslaagd.","De tomaten die in het Verenigd Koninkrijk verkrijgbaar waren, waren vrij hard.","Ze bleven na het bakken in stukken en gaven weinig sap af.","Na het toevoegen van water werd het eindresultaat toch vrij droog."],"improvements":["Koop rijpe, zachtere tomaten.","Bak de tomaten eerst 4–6 minuten apart.","Dek de pan eventueel af en laat de tomaten kort stoven.","Voeg zo nodig een beetje tomatenpuree toe voor meer saus."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: iCook — Tomato and Eggs"]},"hand-torn-cabbage":{"title":"Met de hand gescheurde kool","category":"Groenten","ingredients":["Spitskool","Knoflook","Gedroogde chilipeper"],"instructions":["Scheur de kool in stukken, was die en laat goed uitlekken.","Hak de knoflook fijn en knip de gedroogde chilipeper in stukjes.","Verhit de pan goed en voeg olie toe.","Bak de knoflook en chilipeper kort tot ze geuren.","Voeg eerst de dikkere stronken toe en daarna de bladeren.","Roerbak snel op hoog vuur.","Voeg op het einde sojasaus, azijn en suiker toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen.","De bereiding duurde ongeveer 5 minuten.","De kool was mals, maar had weinig geroosterde smaak.","Er lag wat vocht op de bodem van het bord."],"improvements":["Laat de kool na het wassen goed uitlekken.","Verhit de pan sterker.","Bak in porties als er te veel kool is.","Roer minder vaak.","Probeer de baktijd te verkorten tot ongeveer 2–3 minuten.","Begin met 1 tl azijn."],"nextSeasonings":["Lichte sojasaus: 2 tl","Azijn: 1 tl","Suiker: ¼–½ tl"]},"pressure-cooker-chicken-soup":{"title":"Kippensoep uit de snelkookpan","category":"Soep","ingredients":["Kip","Water"],"instructions":["Doe de kip in de snelkookpan.","Voeg water toe.","Kook de soep in de snelkookpan. Eerder werd ongeveer een uur genoemd, maar de exacte kooktijd en instelling zijn nog niet bevestigd."],"experience":["Ik heb dit gerecht gemaakt.","De smaakmakers, de hoeveelheid kip en de kooktijd onder druk zijn niet vastgelegd; die kunnen de volgende keer worden toegevoegd."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: Wikimedia Commons — Chinese Food - Chicken Soup (CC BY-SA 3.0)"]},"soy-sauce-lamb-ribs":{"title":"Lamsribbetjes met sojasaus","category":"Vlees","ingredients":["Lamsribbetjes"],"seasonings":["Sojasaus","Andere smaakmakers niet vastgelegd"],"experience":["Ik heb dit gerecht gemaakt.","Het was een geïmproviseerd gerecht met sojasaus, geen strikt gevolgd Chinees recept."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto; ze toont een vergelijkbare gestoofde stijl met lamsribbetjes, niet het echte eindresultaat."],"sources":["Webreferentie: Sohu — Braised Lamb Ribs"]},"vinegar-braised-cabbage":{"title":"Kool met azijn","category":"Groenten","ingredients":["Kool: ongeveer 400 g","Knoflook: ongeveer 10 g","Gedroogde chilipeper: ongeveer 5 g","Sichuanpeper: ongeveer 2 g, optioneel"],"seasonings":["Chinkiang-azijn: ongeveer 20 ml","Lichte sojasaus: ongeveer 10 ml","Suiker: ongeveer 5 g","Zout: ongeveer 3 g","Bakolie: ongeveer 25 ml"],"instructions":["Scheid de stronken van de bladeren; snijd de stronken schuin en scheur de bladeren in grote stukken.","Verhit olie in een pan, bak de Sichuanpeper op laag vuur tot die geurt en verwijder die daarna.","Voeg de gedroogde chilipeper en knoflook toe en bak kort tot ze geuren.","Zet het vuur hoog, roerbak de stronken ongeveer 1 minuut en voeg daarna de bladeren ongeveer 30 seconden toe.","Giet de azijn langs de rand van de pan en schep snel om.","Voeg sojasaus, suiker en zout toe, schep kort om en serveer direct."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen."],"improvements":["Niet vastgelegd. Openbare referentierecepten benadrukken dat je stronken en bladeren apart bereidt en snel op hoog vuur roerbakt om overtollig vocht te beperken en de kool knapperig te houden."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 15 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: SciCook — Vinegar Cabbage"]},"padron-peppers-tapas":{"title":"Tapas met Padrónpepers","category":"Groenten","ingredients":["Padrónpepers: ongeveer 500 g"],"seasonings":["Spaanse olijfolie: naar behoefte (een openbare referentie gebruikt ongeveer 300 ml)","Zeezoutvlokken: naar behoefte"],"instructions":["Was de Padrónpepers en laat ze goed uitlekken.","Verhit de olijfolie in een pan.","Voeg de pepers toe en bak ze tot de huid blaasjes vormt en goudbruin wordt.","Laat overtollige olie uitlekken, leg de pepers op een bord en bestrooi met zeezout. Serveer warm."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen.","Dit is een Spaans tapasgerecht."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 17 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: Foods and Wines from Spain — Padrón Peppers"]},"coca-cola-chicken-wings":{"title":"Kipvleugels met Coca-Cola","category":"Vlees","ingredients":["Kipvleugels: ongeveer 8","Coca-Cola met suiker: ongeveer 1 blikje"],"seasonings":["Zout: naar smaak","Shaoxing-wijn: ongeveer 1 el","Lichte sojasaus: ongeveer 10 ml","Donkere sojasaus: ongeveer 5–7 ml","Gember: ongeveer 5 plakjes","Kaneel: ½–1 stokje, optioneel","Steranijs: optioneel"],"instructions":["Snijd of prik beide kanten van de vleugels in zodat ze smaak opnemen; marineer ze desgewenst 30 minuten tot 2 uur met kookwijn en donkere sojasaus.","Begin de vleugels in koud water met gember; breng aan de kook, schep het schuim eraf, spoel met warm water en dep droog.","Bak de vleugels op laag vuur in de pan tot beide kanten goudbruin zijn.","Voeg Coca-Cola, kookwijn, lichte en donkere sojasaus en de optionele specerijen toe; de vloeistof moet de vleugels bijna bedekken.","Laat op laag vuur sudderen tot de vleugels gaar zijn en de vloeistof is ingekookt.","Zet het vuur hoger om de saus in te koken tot die aan de vleugels kleeft; voeg zo nodig zout toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 25 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: Xiachufang — Coca-Cola Chicken Wings","Referentieoverzicht: Wikipedia — Coca-Cola Chicken Wings"]},"fish-vinaigrette":{"title":"Salade met zalm, ei en gemengde sla met visvinaigrette","category":"Salades","ingredients":["Gemengde sla: 2–3 royale handen","Gegaarde zalm: 1 filet, ongeveer 120–150 g","Hardgekookte eieren: 2","Cherrytomaten: 8–10","Avocado: ½","Optioneel feta of een andere milde witte kaas","Optioneel zwarte sesam"],"seasonings":["Extra vierge olijfolie: 3 delen","Azijn: 1 deel","Zout: naar smaak","Peper: naar smaak","Italiaanse kruiden: naar smaak"],"instructions":["Maak de vinaigrette: doe de olijfolie, azijn, zout, peper en Italiaanse kruiden in een klein doorzichtig bakje met een goed sluitend deksel. Sluit het stevig en schud tot alles gemengd is.","Stel de salade samen: verdeel de sla over een grote schaal, voeg de tomaten en avocado toe en leg de zalm en eieren erbovenop.","Werk af: voeg de optionele kaas en zwarte sesam toe, schud de vinaigrette opnieuw, sprenkel die over de salade en serveer direct."],"experience":["Ik heb dit gerecht gemaakt en twee foto's van het eindresultaat genomen."],"notes":["Beide foto's horen bij deze zalmsalade. De exacte bereidingsdatum is niet vastgelegd."]},"honey-mustard-chicken-salad-sauce":{"title":"Kipsalade met honing-mosterdressing","category":"Salades","ingredients":["Dun gesneden kipfilet: 120 g","Gemengde sla: 2–3 royale handen","Hardgekookte eieren: 2","Cherrytomaten: 8–10","Avocado: ½","Een kleine hand grof gehakte noten","Optioneel feta of een andere milde witte kaas","Optioneel zwarte sesam"],"seasonings":["Extra vierge olijfolie: 1 el (15 ml)","Dijonmosterd: 1 el (15 g), of 2 tl Dijon plus 1 tl grove mosterd","Honing: 2 tl (10 ml)","Appelazijn of vers citroensap: 1 tl (5 ml)","Fijn zeezout: 1 snufje","Versgemalen zwarte peper: 1 snufje","Optioneel knoflookpoeder of verse bieslook"],"instructions":["Bereid de kip: kruid rauwe kip, gaar die volledig, laat kort rusten en snijd dun; kant-en-klare kipfiletreepjes kunnen direct worden gebruikt.","Meng de basis: klop de mosterd, honing, azijn of citroensap, zout en peper glad.","Emulgeer de olie: schenk de olijfolie langzaam erbij terwijl je stevig klopt, tot de dressing glanzend en iets dikker is.","Pas de dikte aan: klop ½ tl warm water erdoor als een dunnere dressing gewenst is.","Stel de salade samen: doe de sla, tomaten en avocado in een kom en leg de eieren, kip, noten en optionele toppings erop.","Maak af: meng de helft van de dressing door de kip en sprenkel de rest vlak voor het serveren over de sla."],"experience":["Ik heb dit gerecht gemaakt, maar de specifieke ervaring is nog niet vastgelegd."],"notes":["Dit levert ongeveer 2½ el dressing voor 120 g kip. Bij rauwe kip kan 1 el dressing op laag vuur 30–45 seconden in de pan worden toegevoegd om de kip licht te glaceren; gebruik de rest koud over de salade.","De bereidingsdatum en persoonlijke foto zijn nog niet vastgelegd."]},"red-braised-pork":{"title":"Rood gestoofd buikspek","category":"Vlees","ingredients":["Buikspek: ongeveer 500 g, in blokken van 3–4 cm","Gember: ongeveer 5 plakjes","Bosui: 2–3 stukken"],"seasonings":["Rotssuiker: ongeveer 25–30 g","Lichte sojasaus: ongeveer 2 el","Donkere sojasaus: ongeveer 1 el, voor de kleur","Shaoxing-wijn: ongeveer 2 el","Steranijs: 1–2","Kaneel: 1 klein stukje, optioneel","Water: genoeg om het vlees bijna te bedekken","Zout: op het einde naar smaak"],"instructions":["Begin het vlees in koud water met wat gember. Breng aan de kook, schep het schuim eraf, giet af en dep droog.","Bak het vlees in een beetje olie rondom lichtbruin en haal het uit de pan.","Smelt de rotssuiker op laag vuur tot die amberkleurig is; laat niet aanbranden.","Doe het vlees terug in de pan en voeg gember, bosui, steranijs en kaneel toe.","Voeg de sojasauzen en Shaoxing-wijn toe en schenk er heet water bij.","Breng aan de kook, dek af en laat 60–90 minuten zacht stoven tot het vlees zacht is.","Laat zonder deksel inkoken en breng op smaak met zout."],"notes":["Een typische referentieversie; de echte hoeveelheden en kooktijd kunnen na het maken worden genoteerd.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentierecept: TravelChinaGuide — Red Braised Pork"]},"dongbei-chicken-mushroom-stew":{"title":"Dongbei-kipstoof met paddenstoelen","category":"Vlees","ingredients":["Kipstukken: ongeveer 700 g","Gedroogde hazelnotenpaddenstoelen: ongeveer 30 g, of gedroogde shiitake","Gember: ongeveer 5 plakjes","Bosui: 2–3 stukken"],"seasonings":["Lichte sojasaus: ongeveer 2 el","Donkere sojasaus: ongeveer 1 tl, optioneel","Kookwijn: ongeveer 1 el","Steranijs: 1","Laurierblad: 1–2, optioneel","Zout: naar smaak","Water of gezeefd weekwater van de paddenstoelen: naar behoefte"],"instructions":["Week de gedroogde paddenstoelen zacht, spoel ze en bewaar het heldere weekwater.","Begin de kip in koud water, breng aan de kook, schep het schuim eraf en spoel de stukken af.","Bak gember en bosui geurig, voeg de kip toe en bak die licht aan.","Voeg de sojasauzen, kookwijn, steranijs en laurier toe.","Voeg het paddenstoelenwater en de paddenstoelen toe. Breng aan de kook, dek af en laat 30–45 minuten zacht koken.","Laat zonder deksel inkoken en voeg zout naar smaak toe."],"notes":["Dit is een typische referentieversie uit Dongbei. Hazelnotenpaddenstoelen zijn traditioneel, maar gedroogde shiitake kan ook.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Achtergrond: People's Daily — 小鸡炖蘑菇","Bereidingswijze: DayDayCook — 小鸡炖蘑菇"]},"chicken-glass-noodle-stew":{"title":"Kip gestoofd met glasnoedels","category":"Vlees","ingredients":["Kippendijen of kipstukken: ongeveer 500 g","Glasnoedels: ongeveer 100 g, geweekt tot ze zacht zijn","Gember: ongeveer 5 plakjes","Knoflook: 2 teentjes, optioneel","Bosui: 2–3 stukken"],"seasonings":["Lichte sojasaus: ongeveer 2 el","Donkere sojasaus: ongeveer 1 tl, optioneel","Kookwijn: ongeveer 1 el","Steranijs: 1, optioneel","Zout: naar smaak","Zwarte peper: naar smaak","Water of kippenbouillon: naar behoefte"],"instructions":["Week de noedels volgens de verpakking en knip ze zo nodig korter.","Dep de kip droog en bak die lichtbruin in olie.","Voeg gember, knoflook, bosui en steranijs toe en bak tot ze geuren.","Voeg de sojasauzen en kookwijn toe en schenk er heet water of bouillon bij.","Breng aan de kook, dek af en laat 25–35 minuten zacht koken tot de kip bijna zacht is.","Voeg de noedels toe en laat nog 5–10 minuten koken tot ze zacht maar veerkrachtig zijn.","Breng op smaak met zout en zwarte peper en serveer warm."],"notes":["Voeg de glasnoedels pas op het einde toe zodat ze niet te veel vocht opnemen of uit elkaar vallen.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentierecept: Meishichina — Chicken Stewed with Glass Noodles"]},"gambas-al-ajillo":{"title":"Gambas al Ajillo (Spaanse knoflookgarnalen)","category":"Zeevruchten","ingredients":["Gepelde garnalen: ongeveer 250–300 g","Extra vierge olijfolie: ongeveer 100–150 ml","Knoflook: 4–6 teentjes, in dunne plakjes","Gedroogde chilipeper: 1–2, in stukjes","Peterselie: een beetje, optioneel"],"seasonings":["Zout: naar smaak","Zwarte peper: een beetje, optioneel","Citroensap: een beetje, optioneel"],"instructions":["Ontdooi de garnalen en dep ze droog. Staarten of koppen kunnen blijven zitten voor meer smaak.","Doe olijfolie en knoflook in een kleine pan of cazuela. Verwarm op laag vuur tot de knoflook geurt maar niet verbrandt.","Voeg de gedroogde chili toe en verwarm kort.","Zet het vuur middelhoog tot hoog, voeg garnalen en zout toe en bak snel tot ze roze en net gaar zijn, ongeveer 1–2 minuten per kant.","Werk af met peterselie en eventueel citroensap. Serveer met de hete olie en brood om te dippen."],"notes":["Het gerecht dat je beschreef—garnalen in een klein pannetje met veel olie—is waarschijnlijk gambas al ajillo, een Spaanse tapas.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Achtergrond: Wikipedia — Gambas al Ajillo","Bereidingswijze: Table & Traditions — Gambas al Ajillo"]},"dry-fried-green-beans":{"title":"Sichuan-sperziebonen uit de wok","category":"Groenten","ingredients":["Sperziebonen: ongeveer 400–500 g, schoongemaakt en in stukken","Varkensgehakt: ongeveer 100 g, optioneel","Knoflook: 3–4 teentjes, fijngehakt","Gember: een beetje, fijngehakt, optioneel","Gedroogde chilipeper: 4–6, in stukjes","Sichuanpeper: een beetje"],"seasonings":["Bakolie: naar behoefte","Lichte sojasaus: ongeveer 1 el","Shaoxing-wijn: ongeveer 1 tl, optioneel","Suiker: ½ tl, optioneel","Zout: naar smaak","Ingemaakte mosterdgroenten: een beetje, optioneel"],"instructions":["Was de bonen en droog ze goed. Snijd ze in stukken; overtollig water spat en voorkomt dat ze rimpelen.","Gebruik iets meer olie dan bij een gewone roerbak en bak de bonen tot ze rimpelen, kleine bruine plekjes krijgen en gaar zijn. Haal ze uit de pan.","Laat een beetje olie in de pan en bak de Sichuanpeper en gedroogde chili zacht, voeg daarna knoflook en gember toe.","Voeg eventueel het varkensgehakt toe en bak het bruin; voeg optionele mosterdgroenten toe.","Doe de bonen terug en schep ze op hoog vuur om met sojasaus, wijn, suiker en zout.","Bak tot het gerecht droog en geurig is en serveer direct."],"notes":["De kern van deze techniek is dat je het vocht uit de bonen bakt en ze laat rimpelen voordat de aromaten erbij gaan.","Sperziebonen moeten volledig gaar zijn; stop niet alleen wanneer de buitenkant bruin is.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentierecept: TravelChinaGuide — Sichuan Dry-fried Green Beans"]},"twice-cooked-pork":{"title":"Tweemaal gebakken varkensvlees","category":"Vlees","ingredients":["Buikspek met zwoerd: ongeveer 400–500 g","Knoflookstengels: ongeveer 100–150 g, in stukken","Gember: enkele plakjes","Bosui: 2–3 stukken","Sichuanpeper: een beetje"],"seasonings":["Pixian doubanjiang: ongeveer 1 el","Gefermenteerde zwarte bonen: ongeveer 1 tl, optioneel","Lichte sojasaus: ongeveer 1 tl","Kookwijn: ongeveer 1 el","Suiker: ½ tl, optioneel","Gedroogde chilipeper: een beetje, optioneel"],"instructions":["Kook het buikspek in zijn geheel in koud water met gember, bosui en Sichuanpeper tot het net gaar is. Laat afkoelen en snijd zo dun mogelijk.","Roerbak de plakjes op middelhoog vuur zonder veel extra olie tot de randen krullen en het vet vrijkomt.","Schuif het vlees opzij en bak doubanjiang, zwarte bonen en gedroogde chili in het vrijgekomen vet.","Voeg sojasaus, kookwijn en suiker toe en schep om.","Voeg eerst de stevigere stukken knoflookstengel toe, daarna de bladeren, en roerbak kort op hoog vuur.","Serveer direct met rijst."],"notes":["De kenmerkende techniek is het vlees eerst koken en het daarna een tweede keer in de wok te bereiden met doubanjiang en knoflookstengels.","Een typische Sichuan-referentieversie; de pittigheid en hoeveelheid olie kunnen na het koken worden vastgelegd.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentierecept: TravelChinaGuide — Twice Cooked Pork"]},"hunan-stir-fried-pork":{"title":"Hunan-varkensvlees met pepers uit de wok","category":"Vlees","ingredients":["Varkensvlees: ongeveer 300–400 g, dun gesneden; een mix van buikspek en mager vlees werkt goed","Groene of Hunanpepers: ongeveer 150–200 g, schuin gesneden","Knoflook: 2–3 teentjes","Gember: een beetje, optioneel","Bosui: een beetje, optioneel"],"seasonings":["Lichte sojasaus: ongeveer 1 el","Donkere sojasaus: ½ tl, optioneel","Oestersaus: ongeveer 1 tl, optioneel","Kookwijn: ongeveer 1 tl","Zout: naar smaak","Suiker: een beetje, optioneel","Bakolie: naar behoefte"],"instructions":["Snijd het vlees dun; meng mager vlees eventueel met wat sojasaus en kookwijn en laat kort staan.","Was en droog de pepers en snijd ze schuin. Verhit de wok goed.","Roerbak het vlees op middelhoog tot hoog vuur tot het verkleurt en licht bruint; laat bij buikspek wat vet uitbakken.","Voeg knoflook, gember en bosui toe en bak tot ze geuren.","Voeg de pepers toe en roerbak op hoog vuur tot ze licht blaren hebben maar nog knapperig zijn.","Voeg de sojasauzen, oestersaus, wijn, zout en optionele suiker toe. Schep snel om en serveer direct."],"notes":["Deze huiselijke Hunan-versie benadrukt de geur van varkensvlees en pepers. Licht geblakerde pepers zijn geuriger dan zeer zachte pepers.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentiewijze: DayDayCook — Home-Style Stir-Fried Pork"]},"tom-yum-goong":{"title":"Tom Yum Goong","category":"Soep","ingredients":["Garnalen: ongeveer 300–400 g","Bouillon of water: ongeveer 750 ml–1 l","Citroengras: 2–3 stengels","Laos: 5–8 plakjes","Makrut-limoenblaadjes: 4–6","Paddenstoelen: ongeveer 150 g","Optioneel cherrytomaten en sjalot","Koriander voor de afwerking"],"seasonings":["Vissaus: ongeveer 2 el","Limoensap: ongeveer 3–4 el, op het einde","Thaise rawit: naar smaak","Nam Prik Pao: ongeveer 1 tl, optioneel","Palmsuiker of witte suiker: een beetje, optioneel","Zout: naar smaak"],"instructions":["Bak de garnalenschalen eventueel kort en voeg water of bouillon toe voor meer smaak; kant-en-klare bouillon kan ook.","Voeg citroengras, laos, limoenblaadjes, sjalot en chili toe en laat 3–4 minuten zacht koken.","Voeg de paddenstoelen en tomaten toe en kook tot ze net zacht zijn.","Voeg vissaus en optionele chilipasta en suiker toe en proef.","Voeg de garnalen toe en kook ze roze en net gaar, meestal 1–2 minuten.","Zet het vuur uit, voeg limoensap en koriander toe en breng zout, zuur en pit in balans."],"experience":["Ik heb dit gerecht gemaakt, maar de exacte hoeveelheden, zuur-pittige balans en persoonlijke ervaring zijn nog niet vastgelegd."],"notes":["Voeg het limoensap na het uitzetten van het vuur toe voor een frisse smaak. Er is geen persoonlijke kookfoto."],"sources":["Referentierecept: SBS Food — Tom Yum Goong"]},"steamed-sea-bass":{"title":"Chinese gestoomde zeebaars","category":"Zeevruchten","ingredients":["Zeebaars: 1 hele vis, schoongemaakt","Plakjes gember en julienne gember","Stukken bosui en julienne bosui"],"seasonings":["Gekruide sojasaus voor vis: ongeveer 1–2 el","Bakolie: ongeveer 2 el voor het afwerken","Kookwijn: een beetje, optioneel","Zout: een beetje, optioneel"],"instructions":["Maak de vis schoon en kerf beide kanten in. Kruid licht met zout en kookwijn en dep droog.","Leg gember en bosui op een bord, leg de vis erop en voeg wat gember toe.","Stoom boven krachtig kokend water ongeveer 8–12 minuten, afhankelijk van de grootte.","Controleer het dikste deel, giet het vocht weg en verwijder de oude aromaten.","Leg julienne gember en bosui erop en schenk de sojasaus langs de vis.","Verhit de olie goed heet en giet die over de gember en bosui. Serveer direct."],"experience":["Ik heb dit gerecht gemaakt, maar het gewicht van de vis, de stoomtijd en persoonlijke ervaring zijn nog niet vastgelegd."],"notes":["Verse vis, voorverwarmd stoomwater en niet te lang stomen zijn de belangrijkste punten. Er is geen persoonlijke kookfoto."],"sources":["Referentierecept: Woks of Love — Authentic Steamed Sea Bass"]},"pad-kra-pao-pork":{"title":"Pad Kra Pao met varkensvlees en rijst","category":"Vlees","ingredients":["Varkensgehakt: ongeveer 250–300 g","Jasmijnrijst: om te serveren","Heilige basilicum of Thaise basilicum: een royale hand","Knoflook: 3–4 teentjes","Thaise rawit: 2–5","Optioneel sjalot","Eieren: 1 per portie"],"seasonings":["Lichte sojasaus: ongeveer 1 el","Vissaus: ongeveer 1 el","Oestersaus: ongeveer 1 tl","Suiker: ½–1 tl","Water: een beetje","Bakolie"],"instructions":["Meng de sojasaus, vissaus, oestersaus, suiker en een beetje water.","Bak het ei in iets meer olie dan normaal tot de rand krokant is en de dooier zacht blijft. Zet apart.","Bak knoflook, chili en optionele sjalot in de resterende olie.","Voeg het gehakt toe, breek het los en roerbak tot het bruin is.","Voeg de saus toe en kook tot die grotendeels is ingekookt en het vlees bedekt.","Zet het vuur uit, voeg de basilicum toe en schep om in de restwarmte.","Serveer het basilicumvlees over rijst met het gebakken ei."],"experience":["Ik heb dit gerecht gemaakt, maar de exacte hoeveelheden, pittigheid en persoonlijke ervaring zijn nog niet vastgelegd."],"notes":["De combinatie van varkensvlees, pittige saus, rijst en gebakken ei die je beschreef is de klassieke Pad Kra Pao. Er is geen persoonlijke kookfoto."],"sources":["Referentierecept: Kitchen Stories — Pad Kra Pao"]},"stir-fried-garlic-sprouts":{"title":"Eenvoudig roergebakken knoflookstengels","category":"Groenten","ingredients":["Knoflookstengels: ongeveer 300–400 g","Knoflook: 1 teentje, optioneel"],"seasonings":["Bakolie","Zout","Een beetje lichte sojasaus, optioneel","Een snufje suiker, optioneel"],"instructions":["Was de knoflookstengels, laat ze goed uitlekken en scheid de dikkere stelen van de zachte bladeren.","Verhit de wok goed, voeg olie toe en roerbak de stelen op hoog vuur.","Voeg de bladeren en optionele knoflook toe zodra de stelen zachter worden en bak tot alles helder en net gaar is.","Breng op smaak met zout en optionele sojasaus en suiker en serveer direct."],"notes":["Een eenvoudige referentieversie; de echte baktijd en gewenste textuur kunnen na het maken worden genoteerd.","Er is nog geen persoonlijke kookfoto vastgelegd."]},"silky-eggs-with-shrimp":{"title":"Zijdezachte eieren met garnalen (thuisstijl van Wang Gang)","category":"Zeevruchten","ingredients":["Verse garnalen: 80 g","Eieren: 5","Bosui: naar behoefte"],"seasonings":["Zout: 1,5 g (ongeveer ¼ tl)","Gemalen peper: een beetje, minder dan ¼ tl","Witte azijn: een beetje","Bakolie: genoeg om de wok te bedekken, plus een beetje olie op de bodem"],"instructions":["Bereid de garnalen: verwijder met een tandenstoker het darmkanaal. Kook de garnalen tot het lichaam vanzelf kromtrekt en helemaal gaar is. Verwijder de koppen en schalen en snijd elke garnaal in de lengte doormidden.","Maak het eimengsel: breek 5 eieren in een roestvrijstalen kom. Voeg 1,5 g zout, wat peper, een beetje witte azijn en de bosui toe. Klop goed tot er wat schuim op het oppervlak ontstaat.","Verhit de wok: verhit de wok, voeg genoeg olie toe om het oppervlak te bedekken en duw de olie met een spatel rond. Giet de overtollige olie weg en voeg daarna veel minder olie op de bodem toe.","Gebruik de restwarmte: haal de wok van het vuur, giet het eimengsel erin en beweeg het voorzichtig terwijl het door de restwarmte langzaam stolt. Zet de wok terug op het fornuis zodra het ei begint te stollen en roer verder op laag vuur.","Bepaal de gaarheid: na ongeveer 50 seconden zijn de eieren zacht en gaar; na ongeveer 60 seconden zijn ze extra zacht; na ongeveer 80 seconden lijken ze meer op gewone roereieren. Haal ze eruit zodra ze de gewenste gaarheid hebben en bak ze niet te lang. Pas de tijd aan de werkelijke hitte en temperatuur van de wok aan."],"experience":["Ik heb dit gerecht gemaakt en een persoonlijke foto van het eindresultaat aangeleverd.","Uitgebreide smaaknotities zijn nog niet vastgelegd."],"notes":["Blancheer de garnalen eerst, zodat het ei niet gaar is voordat de garnalen veilig gaar zijn.","Voeg geen MSG, kippenbouillon of andere extra umamismaakmakers toe, zodat de natuurlijke smaak van ei en garnalen duidelijk blijft.","De tijden van 50, 60 en 80 seconden zijn richtpunten uit de video van de chef; pas ze aan de werkelijke hitte en woktemperatuur aan.","De afbeelding is een persoonlijke kookfoto uit het receptenarchief."],"sources":["Door de gebruiker aangeleverde transcriptie van een Wang Gang-recept in thuisstijl; de originele videolink is niet vastgelegd."]},"garlic-stir-fried-iceberg-lettuce":{"title":"Roergebakken ijsbergsla met knoflook","category":"Groenten","ingredients":["½ krop ijsbergsla, ongeveer 250 g","Knoflook: 3 teentjes, fijngehakt","Bakolie: 1 el","Zout: ongeveer ¼ tl","Lichte sojasaus: ½ tl, optioneel"],"instructions":["Snijd de harde kern weg, scheur de bladeren in stukken van 5–7 cm, was ze en laat ze goed uitlekken. Hoe droger de sla, hoe minder water er in de pan komt.","Verdeel de knoflook in twee porties: ongeveer twee derde voor het aromatische bakvet en de rest vlak voor het serveren.","Verhit een wok of koekenpan 30–60 seconden op middelhoog tot hoog vuur. Voeg olie en twee derde van de knoflook toe en bak 10–15 seconden tot het geurt; laat de knoflook niet donkergeel worden.","Zet het vuur hoog, voeg alle sla toe en roerbak ongeveer 30 seconden. Voeg het zout toe zodra de sla begint te slinken, samen met de rest van de knoflook, en bak nog 15–30 seconden.","Zet het vuur uit zodra de randen zacht zijn maar de dikkere delen nog knapperig. Serveer direct; voeg geen water toe en dek de pan niet af."],"experience":["Ik heb dit gerecht gemaakt; uitgebreide smaaknotities en verbeterpunten zijn nog niet vastgelegd."],"notes":["Gebruik bij een pan van 24–26 cm per keer ongeveer 200–250 g sla zodat de pan heet blijft.","Voeg het zout pas aan het einde toe om overtollig vocht te beperken.","Dit is een persoonlijke foto uit het receptenarchief."]},"guo-bao-rou":{"title":"Guo Bao Rou (krokant zoetzuur varkensvlees)","category":"Vlees","ingredients":["Varkenshaas of varkensschouder: ongeveer 400 g, dun gesneden","Aardappelzetmeel: ongeveer 100 g, tot een dik beslag gemengd","Wortel, bosui, gember en koriander: een beetje voor de afwerking"],"seasonings":["Zout: ongeveer ½ tl","Suiker: ongeveer 3–4 el","Witte of rijstazijn: ongeveer 3–4 el","Knoflook: 1–2 teentjes","Bakolie om te frituren","Water: een beetje"],"instructions":["Meng het aardappelzetmeel met water tot een dik beslag en laat het hydrateren.","Kruid het vlees met zout en laat ongeveer 10 minuten staan. Bereid wortel, bosui, gember en knoflook voor.","Haal het vlees door het beslag en frituur het op matige temperatuur tot het stevig en licht goudbruin is; laat uitlekken.","Verhoog de temperatuur en frituur het vlees een tweede keer tot het krokant is.","Laat suiker, azijn en een beetje water koken tot de saus opgelost en iets dikker is.","Voeg de aromaten toe, doe het vlees terug, schep snel om en serveer direct."],"notes":["De Noordoost-Chinese versie draait om een krokant jasje van aardappelzetmeel en een snelle zoetzure saus.","Laat de saus niet te dik worden en laat het vlees er niet lang in liggen, anders wordt het korstje zacht.","De afbeelding is een webreferentie, geen persoonlijke kookfoto."],"sources":["Referentierecept: The Soy Food Cookbook — 锅包肉"]}},"photos":{"hand-torn-cabbage-2026-10-12.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"hand-torn-cabbage-2026-10-29.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"garlic-oyster-sauce-pak-choi-2026-10-25.jpg":{"identifiedAs":"Paksoi met knoflook en oestersaus","note":"Betrouwbaar gekoppeld aan dit recept."},"stir-fried-cabbage-vegetable-review-2026-10-15.jpg":{"identifiedAs":"Kool met azijn","note":"Door de gebruiker bevestigd als kool met azijn."},"pan-fried-green-peppers-review-2026-10-17.jpg":{"identifiedAs":"Tapas met Padrónpepers","note":"Door de gebruiker bevestigd als Spaanse tapas met Padrónpepers."},"soy-glazed-chicken-review-2026-10-25.jpg":{"identifiedAs":"Kipvleugels met Coca-Cola","note":"Door de gebruiker bevestigd als kipvleugels met Coca-Cola."},"fish-vinaigrette-1.jpg":{"date":"Niet vastgelegd","identifiedAs":"Salade met zalm, ei en gemengde sla","note":"Een persoonlijke kookfoto die bij het recept voor visvinaigrette is aangeleverd."},"fish-vinaigrette-2.jpg":{"date":"Niet vastgelegd","identifiedAs":"Salade met zalm, ei en gemengde sla","note":"Een persoonlijke kookfoto die bij het recept voor visvinaigrette is aangeleverd."},"silky-eggs-with-shrimp-photo-1.jpg":{"date":"Niet vastgelegd","identifiedAs":"Zijdezachte eieren met garnalen","note":"Een persoonlijke foto van het eindresultaat die door de gebruiker is aangeleverd."},"blanched-iceberg-lettuce-photo-1.jpg":{"date":"Niet vastgelegd","identifiedAs":"Geblancheerde ijsbergsla (Kantonese stijl)","note":"Een persoonlijke foto van het eindresultaat die door de gebruiker is aangeleverd."}}}}}</script>
