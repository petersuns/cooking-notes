uploads/step/cover/234334/8b9d5fb97aab0b68.jpg","photos":[]},{"id":"blanched-iceberg-lettuce","title":"白灼生菜（广东做法）","status":"cooked","cuisine":"Chinese","category":"蔬菜","tags":["vegetables","quick-meal","iceberg-lettuce"],"cover":"../../images/photos/blanched-iceberg-lettuce-photo-1.jpg","ingredients":["Iceberg Lettuce（球生菜）：半颗，约 1–2 人份","大蒜：2–3 瓣","水：约 1–1.5 L，用于焯菜"],"seasonings":["蚝油：1 tbsp（15 ml）","生抽：1 tbsp（15 ml）","糖：½ tsp","食用油：1 tbsp，用于制作蒜蓉蚝油汁","盐：½ tsp，用于焯水","食用油：½ tsp，用于焯水"],"instructions":["准备生菜：将半颗 Iceberg Lettuce 用手撕成较大的叶片，洗净并充分沥水；不要撕得太小，否则焯水后容易软塌。大蒜切成蒜末。","调蚝油汁：在小碗中混合蚝油 1 tbsp、生抽 1 tbsp、糖 ½ tsp 和水 2 tbsp，搅拌均匀备用。","白灼生菜：锅中加入约 1–1.5 L 水，大火煮沸后加入盐 ½ tsp 和食用油 ½ tsp。放入生菜，Iceberg Lettuce 焯 10–20 秒即可；只需要稍微软化，仍然保持爽脆。立即捞出，充分沥水装盘，不要过冷水。","制作蒜蓉蚝油汁：锅中加入 1 tbsp 食用油，中小火加热。放入蒜末，炒约 15–25 秒，闻到蒜香后倒入调好的蚝油汁；煮至微微冒泡，再煮约 15–20 秒后关火。不要把蒜炒焦，否则会发苦。","淋汁：把热的蒜蓉蚝油汁均匀浇在生菜上，立即食用。"],"experience":["已实际做过，觉得很好吃。"],"improvements":[],"nextSeasonings":[],"notes":["Iceberg Lettuce 比广东常用的生菜更脆、水分更多，因此焯水时间要短；10–20 秒通常足够。","生菜一定要充分沥干，否则蚝油汁会被稀释。","蚝油和生抽本身含盐，酱汁通常不需要额外加盐。","在伦敦 Tesco 或 Sainsbury's 购买时，也可以尝试 Little Gem Lettuce：叶片更厚，焯水后更容易保持形状；如果家里已有 Iceberg，直接使用即可。"],"sources":[],"filename":"recipes/cooked/blanched-iceberg-lettuce.md","referenceImage":null,"photos":[{"originalFile":"Photo 1.jpg","displayFile":"blanched-iceberg-lettuce-photo-1.jpg","date":"日期未记录","identifiedAs":"白灼生菜（广东做法）","matchStatus":"matched","recipeId":"blanched-iceberg-lettuce","note":"用户提供的白灼生菜个人成品照片。","available":true,"publicPath":"./images/photos/blanched-iceberg-lettuce-photo-1.jpg"}]},{"id":"garlic-stir-fried-iceberg-lettuce","title":"蒜蓉炒生菜（Iceberg Lettuce）","status":"cooked","cuisine":"Chinese","category":"蔬菜","tags":["vegetables","iceberg-lettuce","garlic","quick-meal"],"cover":"../../images/photos/garlic-stir-fried-iceberg-lettuce-2026-11-02.jpg","ingredients":["半颗 Iceberg lettuce，约 250 g","大蒜 3 瓣，切细末","食用油 1 tbsp（15 ml）","盐约 1/4 tsp","可选：生抽 1/2 tsp"],"seasonings":[],"instructions":["**Prepare the lettuce:** 切掉根部硬芯，把叶子撕 ooked","cuisine":"Western","category":"沙拉","tags":["salad","seafood","salmon","simple"],"cover":"../../images/photos/fish-vinaigrette-1.jpg","ingredients":["混合生菜：2–3 大把，例如绿叶生菜和红叶生菜","熟三文鱼：1 片，约 120–150 g，简单调味后掰成大块","水煮蛋：2 个，对半或切成四块","樱桃番茄：8–10 个，对半切开","牛油果：½ 个，切片或切丁","可选：少量菲达奶酪或其他味道温和的白奶酪","可选：黑芝麻，最后撒上"],"seasonings":["特级初榨橄榄油：3 份","醋：1 份","盐：适量","黑胡椒：适量","意大利综合香料：适量"],"instructions":["制作油醋汁：将橄榄油、醋、盐、黑胡椒和意大利综合香料放入一个最小的透明密封容器中，盖紧后摇匀。","组合沙拉：把混合生菜放入大盘，加入樱桃番茄和牛油果，再摆上三文鱼和水煮蛋。","完成：按喜好加入奶酪和黑芝麻。再次摇匀油醋汁，淋在沙拉上后立即食用。"],"experience":["已实际做过，并拍下了两张成品照片。"],"improvements":[],"nextSeasonings":[],"notes":[],"sources":[],"filename":"recipes/cooked/fish-vinaigrette.md","referenceImage":null,"photos":[{"originalFile":"fish-vinaigrette-1.jpg","displayFile":"fish-vinaigrette-1.jpg","date":"日期未记录","identifiedAs":"三文鱼鸡蛋混合生菜沙拉","matchStatus":"matched","recipeId":"fish-vinaigrette","note":"随鱼汁油醋汁菜谱提供的个人实拍照片。","available":true,"publicPath":"./images/photos/fish-vinaigrette-1.jpg"},{"originalFile":"fish-vinaigrette-2.jpg","displayFile":"fish-vinaigrette-2.jpg","date":"日期未记录","identifiedAs":"三文鱼鸡蛋混合生菜沙拉","matchStatus":"matched","recipeId":"fish-vinaigrette","note":"随鱼汁油醋汁菜谱提供的个人实拍照片。","available":true,"publicPath":"./images/photos/fish-vinaigrette-2.jpg"}]},{"id":"honey-mustard-chicken-salad-sauce","title":"蜂蜜芥末鸡肉沙拉","status":"cooked","cuisine":"Western","category":"沙拉","tags":["salad","chicken","dressing","simple"],"cover":null,"ingredients":["薄切鸡胸肉：120 g，可以使用超市购买的熟鸡肉片，或将熟鸡胸肉切薄","混合生菜：2–3 大把，例如绿叶生菜和红叶生菜","水煮蛋：2 个，对半或切成四块","樱桃番茄：8–10 个，对半切开","牛油果：½ 个，切片或切丁","坚果：一小把，粗略切碎，例如杏仁、核桃或腰果","可选：少量菲达奶酪或其他味道温和的白奶酪","可选：黑芝麻，最后撒上"],"seasonings":["特级初榨橄榄油：1 tbsp（15 ml）","第戎芥末：1 tbsp（15 g）；也可以用 2 tsp 第戎芥末加 1 tsp 粒粒芥末增加口感","蜂蜜：2 tsp（10 ml）","苹果醋或新鲜柠檬汁：1 tsp（5 ml），用来平衡甜味并帮助乳化","细海盐：1 小撮","现磨黑胡椒：1 小撮","可选：极少量蒜粉或一小撮切碎的新鲜细香葱"],"instructions":["准备鸡肉：如果使用生鸡胸肉，用盐和胡椒调味，彻底煮熟后稍微静置，再切成薄片；如果使用现成的熟鸡肉片，可直接使用。","混合酱汁底：在小碗中将芥末、蜂蜜、醋（或柠檬汁）、盐和黑胡椒搅拌至完全顺滑。","乳化橄榄油：一边快速搅拌，一边慢慢将橄榄油细细地倒入芥末混合物中，直到酱汁变得有光泽并稍微变稠。","调整浓稠度：尝味后按需要调整。如果想让酱汁更适合淋在嫩叶上，可以加入 ½ tsp 温水搅匀。","组合沙拉：把生菜、樱桃番茄和牛油果放入碗中，摆上水煮蛋、薄切鸡肉和坚果，再加入可选的奶酪和黑芝麻。","拌匀后食用：将一半酱汁拌入鸡肉，另一半在上桌前立即淋到生菜上。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["这个配方按 120 g 鸡肉计算，大约可得到 2½ tbsp 乳化酱汁，足够拌鸡肉并调味一份配菜沙拉。","如果使用生鸡肉，可以在煎好后转小火，在锅中加入 1 tbsp 酱汁，让鸡肉裹上酱汁并轻微焦糖化 30–45 秒；剩下的酱汁冷拌沙拉。","网络参考图只用于帮助想象成品，不是个人实拍照片。"],"sources":["参考做法与图片来源：[Savory Spiral — Honey Mustard Chicken Salad](https://savoryspiral.com/honey-mustard-chicken-salad-fresh-and-tasty-delight/)"],"filename":"recipes/cooked/honey-mustard-chicken-salad-sauce.md","referenceImage":"https://cdn.savoryspiral.com/images/4fbd47ed-cafc-4850-a252-42136aacfcce_3a17056e.webp","photos":[]},{"id":"red-braised-pork","title":"红烧肉","status":"to-try","cuisine":"Chinese","category":"其他","tags":["meat","pork","braised","home-style"],"cover":null,"ingredients":["五花肉：约 500 g，切成 3–4 cm 方块","姜：约 5 片","葱：2–3 段"],"seasonings":["冰糖：约 25–30 g","生抽：约 2 tbsp","老抽：约 1 tbsp，用于上色，可按颜色减少","料酒或绍兴酒：约 2 tbsp","八角：1–2 个","桂皮：1 小段，可选","水：足量，接近没过猪肉","盐：最后按味道调整"],"instructions":["五花肉冷水下锅，加入少量姜片，煮开后撇去浮沫，捞出并擦干。","锅中少油，将五花肉各面煎至微微金黄，先盛出。","锅中留少量油，加入冰糖，小火加热至融化并呈琥珀色；不要炒焦。","放回五花肉，加入姜、葱、八角和桂皮，翻匀上色。","加入生抽、老抽和料酒，再加入足量热水。","煮开后转小火，盖盖炖约 60–90 分钟，直到肉变软。","打开锅盖转中高火收汁，尝味后再决定是否加盐。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["这是一个典型的红烧肉参考版本，实际用量和炖煮时间等做过后再记录。","网络参考图只用于帮助想象成品，不是个人实拍照片。"],"sources":["参考做法：[TravelChinaGuide — Red Braised Pork](https://www.travelchinaguide.com/tour/food/chinese-cooking/stewed-pork.htm)"],"filename":"recipes/cooked/red-braised-pork.md","referenceImage":"https://imgs.shanghaifoodmenu.com/uploads/images/202606/shanghai_braised_pork_belly_1200.webp","photos":[]},{"id":"dongbei-chicken-mushroom-stew","title":"小鸡炖蘑菇","status":"to-try","cuisine":"Chinese","category":"其他","tags":["meat","chicken","mushrooms","stew","home-style"],"cover":null,"ingredients":["鸡块：约 700 g，可用鸡腿、鸡翅或带骨鸡块","干榛蘑：约 30 g；也可以用干香菇替代","姜：约 5 片","葱：2–3 段"],"seasonings":["生抽：约 2 tbsp","老抽：约 1 tsp，可选","料酒：约 1 tbsp","八角：1 个","香叶：1–2 片，可选","盐：适量","水或泡蘑菇的水：足量"],"instructions":["干蘑菇提前泡软，洗净并保留清澈的泡蘑菇水。","鸡块冷水下锅，煮开后撇去浮沫，捞出并冲洗干净。","锅中加油，放入姜片和葱段炒香，再加入鸡块翻炒至表面略微上色。","加入生抽、老抽、料酒、八角和香叶，翻炒均匀。","倒入泡蘑菇水或热水，加入蘑菇；煮开后转小火，盖盖炖约 30–45 分钟。","鸡肉变软后开盖收汁，按味道加盐，趁热食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["小鸡炖蘑菇是东北风味炖菜，传统上常用榛蘑；买不到时可用香菇等干蘑菇替代。","这是一个典型参考版本，实际鸡肉部位、蘑菇种类和时间等做过后再记录。","网络参考图不是个人实拍照片。"],"sources":["参考背景：[人民网 — 小鸡炖蘑菇](https://health.people.com.cn/n1/2018/0707/c14739-30132623.html)","参考做法：[DayDayCook — 小鸡炖蘑菇](https://www.daydaycook.com/zh-Hans/recipe/braised-chicken-with-mushroom-and-noodle)"],"filename":"recipes/cooked/dongbei-chicken-mushroom-stew.md","referenceImage":"https://i2.kknews.cc/0rTuV5ugw5jUWA5qflm4zohzGCY-Gmjfb1s8lgKV_40/0.jpg","photos":[]},{"id":"chicken-glass-noodle-stew","title":"鸡肉炖粉条","status":"to-try","cuisine":"Chinese","category":"其他","tags":["meat","chicken","glass-noodles","stew","home-style"],"cover":null,"ingredients":["鸡腿或鸡块：约 500 g","粉条：约 100 g，提前泡软","姜：约 5 片","蒜：2 瓣，可选","葱：2–3 段"],"seasonings":["生抽：约 2 tbsp","老抽：约 1 tsp，可选","料酒：约 1 tbsp","八角：1 个，可选","盐：适量","黑胡椒：适量","水或鸡汤：足量"],"instructions":["粉条按包装说明泡软；如果很长，可以剪成适合入口的长度。","鸡块擦干，锅中加油，将鸡块煎至表面微微金黄。","加入姜、蒜、葱和八角，炒出香味。","加入生抽、老抽和料酒，翻炒均匀后倒入热水或鸡汤。","煮开后转小火，盖盖炖至鸡肉基本熟透，约 25–35 分钟。","加入泡软的粉条，再炖约 5–10 分钟，直到粉条吸收汤汁但仍有弹性。","尝味后用盐和黑胡椒调整，趁热食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["粉条要最后加入，避免长时间炖煮后过度吸水或变碎。","这是一个家常参考版本，实际鸡肉部位、粉条种类和调味比例等做过后再记录。","网络参考图不是个人实拍照片。"],"sources":["参考做法：[美食天下 — 鸡肉炖粉条](https://home.meishichina.com/recipe-423650.html)"],"filename":"recipes/cooked/chicken-glass-noodle-stew.md","referenceImage":"https://tukuimg.bdstatic.com/processed/061ba6143cc326d3266fec0536bf7b3d.jpeg%40s_0%2Cw_800%2Ch_1000%2Cq_80","photos":[]},{"id":"gambas-al-ajillo","title":"蒜香油浸虾（Gambas al Ajillo）","status":"to-try","cuisine":"Spanish","category":"其他","tags":["seafood","spanish","tapas","garlic","quick-meal"],"cover":null,"ingredients":["去壳虾仁：约 250–300 g，尽量擦干","特级初榨橄榄油：约 100–150 ml，要能在小锅中形成明显油层","蒜：4–6 瓣，切薄片","干辣椒：1–2 根，剪段或切圈","欧芹：少量，切碎，可选"],"seasonings":["盐：适量","黑胡椒：少量，可选","柠檬汁：少量，可选"],"instructions":["虾仁解冻后充分擦干；如果使用带壳虾，可以保留尾部或虾头增加风味。","在小铸铁锅或浅锅中加入橄榄油和蒜片，小火慢慢加热，让蒜释放香味但不要变焦。","加入干辣椒，继续加热片刻。","转中高火加入虾仁，加盐，快速翻动，直到虾仁变粉红并刚好熟透，通常每面约 1–2 分钟。","撒上欧芹，按喜好加少量柠檬汁，连同热油一起上桌，配面包蘸油食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["你描述的“几个虾仁在一锅油里”的西班牙 tapas 很可能就是 Gambas al Ajillo，也叫 Spanish garlic prawns。","这道菜的重点是橄榄油、蒜和虾；虾不要煮太久，否则会变老。","网络参考图不是个人实拍照片。"],"sources":["参考背景：[Wikipedia — Gambas al Ajillo](https://en.wikipedia.org/wiki/Gambas_al_ajillo)","参考做法：[Table & Traditions — Gambas al Ajillo](https://www.tableandtraditions.com/recipes/gambas-al-ajillo)"],"filename":"recipes/cooked/gambas-al-ajillo.md","referenceImage":"https://dynamic-media-cdn.tripadvisor.com/media/photo-o/2e/52/a5/af/caption.jpg?h=1100&s=1&w=1100","photos":[]},{"id":"dry-fried-green-beans","title":"干煸四季豆","status":"to-try","cuisine":"Chinese","category":"其他","tags":["vegetables","green-beans","sichuan","spicy","quick-meal"],"cover":null,"ingredients":["四季豆：约 400–500 g，去两头并掰成段","猪肉末：约 100 g，可选","蒜：3–4 瓣，切末","姜：少量，切末，可选","干辣椒：4–6 根，剪段","花椒：少量"],"seasonings":["食用油：适量","生抽：约 1 tbsp","料酒：约 1 tsp，可选","糖：½ tsp，可选","盐：适量","碎米芽菜：少量，可选"],"instructions":["四季豆洗净后充分擦干或沥干，掰成段；水分太多容易溅油，也不容易煸出皱皮。","锅中加入比平时炒菜稍多的油，放入四季豆，中火煸炒至表面起皱、出现小焦斑，内部刚好熟透，盛出备用。","锅中留少量油，小火炒香花椒和干辣椒，再加入蒜末和姜末。","如果使用猪肉末，加入后炒至变色并略微焦香；可选加入米芽菜。","放回四季豆，加入生抽、料酒、糖和盐，大火快速翻匀。","炒至表面干爽、香味融合后立即出锅。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["“干煸”的关键是先把四季豆煸到起皱并减少水分，再加入香料和调味料。","四季豆必须彻底加热至熟透，不要只追求表面焦香。","网络参考图不是个人实拍照片。"],"sources":["参考做法：[TravelChinaGuide — Sichuan Dry-fried Green Beans](https://www.travelchinaguide.com/tour/food/chinese-cooking/dryfried-green-beans.htm)"],"filename":"recipes/cooked/dry-fried-green-beans.md","referenceImage":"https://dw-media.tkww.hk/epaper/wwp/20221108/TXT_JPG/a17a10.jpg","photos":[]},{"id":"twice-cooked-pork","title":"回锅肉","status":"to-try","cuisine":"Chinese","category":"其他","tags":["meat","pork","sichuan","spicy","home-style"],"cover":null,"ingredients":["带皮五花肉：约 400–500 g","蒜苗：约 100–150 g，切段","姜：几片","葱：2–3 段","花椒：少量"],"seasonings":["郫县豆瓣酱：约 1 tbsp","豆豉：约 1 tsp，可选","生抽：约 1 tsp","料酒：约 1 tbsp","糖：½ tsp，可选","干辣椒：少量，可选"],"instructions":["五花肉整块冷水下锅，加入姜、葱和花椒，煮至刚刚熟透；捞出放凉后切成尽可能薄的片。","锅中不必加太多油，放入肉片，中火煸炒至边缘微卷并释放出油脂。","将肉片拨到一边，利用锅中的油炒香豆瓣酱、豆豉和干辣椒。","加入生抽、料酒和糖，翻炒使肉片均匀裹上红亮的酱汁。","先加入蒜苗较硬的茎段翻炒，再加入叶子，大火快速炒至断生。","立即出锅，配米饭食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["回锅肉的核心是“先煮后炒”：肉片要薄，先把油脂煸出，再用豆瓣酱和蒜苗完成第二次烹调。","这是一个典型川菜参考版本，具体辣度和油量做过后再记录。","网络参考图不是个人实拍照片。"],"sources":["参考做法：[TravelChinaGuide — Twice Cooked Pork](https://www.travelchinaguide.com/tour/food/chinese-cooking/twice-cooked-pork.htm)"],"filename":"recipes/cooked/twice-cooked-pork.md","referenceImage":"https://chinawondersguide.com/uploads/76/a/c4f2ca20bcb0d46ec7507a6e055c36e7be9cc.jpeg","photos":[]},{"id":"hunan-stir-fried-pork","title":"小炒肉","status":"to-try","cuisine":"Chinese","category":"其他","tags":["meat","pork","spicy","home-style","quick-meal"],"cover":null,"ingredients":["猪肉：约 300–400 g，可用五花肉和瘦肉混合，切薄片","青椒或湖南椒：约 150–200 g，切斜片","蒜：2–3 瓣，切片或切末","姜：少量，可选","葱：少量，可选"],"seasonings":["生抽：约 1 tbsp","老抽：½ tsp，可选","蚝油：约 1 tsp，可选","料酒：约 1 tsp","盐：适量","糖：少量，可选","食用油：适量"],"instructions":["猪肉切成薄片；如果使用较瘦的肉，可以用少量生抽和料酒抓匀，静置片刻。","青椒洗净擦干，切成斜片；锅要充分预热。","先下猪肉片，中高火翻炒至变色并略微焦香；如果使用五花肉，煸出多余油脂。","加入蒜、姜和葱，快速炒香。","加入青椒，保持大火翻炒至表面出现轻微焦斑但仍有口感。","加入生抽、老抽、蚝油、料酒、盐和可选的糖，快速翻匀后立即出锅。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["小炒肉通常突出猪肉香和辣椒香；辣椒不要炒得过软，表面有轻微起泡或焦斑会更香。","这是一个家常湖南风味参考版本，肉的部位和辣椒品种可以按实际购买情况调整。","网络参考图不是个人实拍照片。"],"sources":["参考背景与做法：[DayDayCook — 农家小炒肉](https://www.daydaycook.com/zh-Hans/recipe/hometown-stir-fried-pork)"],"filename":"recipes/cooked/hunan-stir-fried-pork.md","referenceImage":"https://res.cloudinary.com/dxocatyhb/image/upload/ar_16%3A9%2Cc_fit%2Cw_1000/v1732982664/stir-fried-pork-with-peppers.webp","photos":[]},{"id":"tom-yum-goong","title":"冬阴功","status":"cooked","cuisine":"Thai","category":"汤","tags":["seafood","soup","thai","spicy","simple"],"cover":null,"ingredients":["虾：约 300–400 g，去壳去虾线；虾壳可留作熬汤","高汤或水：约 750 ml–1 L","香茅：2–3 根，拍裂切段","南姜：约 5–8 片","青柠叶：4–6 片，撕开","蘑菇：约 150 g","小番茄：6–8 个，对半切开，可选","红葱头：2–3 个，可选","香菜：少量，出锅装饰"],"seasonings":["鱼露：约 2 tbsp，按口味调整","青柠汁：约 3–4 tbsp，最后加入","泰国小米椒：适量，拍碎或切段","泰式辣椒膏（Nam Prik Pao）：约 1 tsp，可选","棕榈糖或白糖：少量，可选","盐：适量"],"instructions":["如果保留虾壳，可以先用少量油炒香，再加入水或高汤煮出底味；也可以直接使用现成高汤。","加入香茅、南姜、青柠叶、红葱头和辣椒，煮 3–4 分钟，让香味进入汤中。","加入蘑菇和番茄，煮至刚刚变软。","加入鱼露和可选的辣椒膏、糖，搅匀后尝味。","加入虾，煮到虾变粉红、刚好熟透，通常只需要约 1–2 分钟。","关火后加入青柠汁，撒上香菜；最后用鱼露、酸度和辣度调整平衡。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["青柠汁最后关火后加入，可以更好地保留酸味和香气。","这份记录是典型冬阴功参考版本；没有个人实拍照片。"],"sources":["参考做法：[SBS Food — Tom Yum Goong](https://www.sbs.com.au/food/the-cook-up-with-adam-liaw/recipe/tom-yum-goong/cnubotmaz)"],"filename":"recipes/cooked/tom-yum-goong.md","referenceImage":"https://topthairealty.com/storage/39/content-2-top-10-thai-street-foods-you-must-try-4-tom-yum-goong-soup-with-fresh-herbs-2025-10-17-06-52-28.png","photos":[]},{"id":"steamed-sea-bass","title":"清蒸鲈鱼","status":"cooked","cuisine":"Chinese","category":"海鲜","tags":["seafood","fish","steamed","simple"],"cover":null,"ingredients":["鲈鱼：1 条，处理干净","姜：数片，另切少量姜丝","葱：数段，另切少量葱丝"],"seasonings":["蒸鱼豉油：约 1–2 tbsp，按鱼的大小调整","食用油：约 2 tbsp，用于最后淋热油","料酒：少量，可选","盐：少量，可选"],"instructions":["鲈鱼处理干净，在鱼身两面各划几刀；用少量盐和料酒简单腌几分钟后擦干。","盘中铺姜片和葱段，放上鲈鱼，再在鱼身上放少量姜片。","水烧开后上锅，大火蒸约 8–12 分钟，具体时间根据鱼的大小调整。","用筷子插入鱼身最厚处确认已经熟透，取出后倒掉盘中蒸出的水分和姜葱。","换上姜丝和葱丝，沿盘边淋入蒸鱼豉油。","将食用油烧至冒烟或明显变热，均匀淋在葱姜丝上，立即食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["清蒸鲈鱼的重点是鱼要新鲜、蒸锅水要先烧开，并避免蒸得过久。","这份记录是典型家常参考版本；没有个人实拍照片。"],"sources":["参考做法：[Woks of Love — Authentic Steamed Sea Bass](https://woksoflove.com/authentic-steamed-sea-bass-qing-zheng-lu-yu-15-minute-recipe/)"],"filename":"recipes/cooked/steamed-sea-bass.md","referenceImage":"https://tokyo-kitchen.icook.network/uploads/step/cover/1300978/b25caedd47065c93.jpg","photos":[]},{"id":"pad-kra-pao-pork","title":"泰式打抛猪饭","status":"cooked","cuisine":"Thai","category":"肉类","tags":["meat","pork","thai","spicy","quick-meal"],"cover":null,"ingredients":["猪肉末：约 250–300 g","茉莉香米饭：适量","打抛叶或圣罗勒：一大把；买不到时可用泰国罗勒作为替代","蒜：3–4 瓣，切碎","泰国小米椒：2–5 根，切碎，按辣度调整","红葱头：1–2 个，切片，可选","鸡蛋：每份 1 个"],"seasonings":["生抽：约 1 tbsp","鱼露：约 1 tbsp","蚝油：约 1 tsp","糖：½–1 tsp","清水：少量，用于调开酱汁","食用油：煎蛋和炒肉使用"],"instructions":["将生抽、鱼露、蚝油、糖和少量清水混合成酱汁。","锅中加入比平时煎蛋稍多的油，煎鸡蛋至边缘酥脆、蛋白凝固而蛋黄仍可保持流心，盛出备用。","用锅中余油炒香蒜、辣椒和红葱头。","加入猪肉末，大火翻炒并压散，炒至变色并略微焦香。","倒入酱汁，继续翻炒至汤汁基本收干并裹住肉末。","关火后加入打抛叶或罗勒叶，利用余温炒至刚刚萎缩。","将打抛猪盖在米饭上，放上煎蛋立即食用。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["你描述的“猪肉、很辣的酱、米饭和煎蛋”就是泰国常见的 Pad Kra Pao（打抛饭）组合。","这份记录是典型猪肉版本；没有个人实拍照片。"],"sources":["参考做法：[Kitchen Stories — Pad Kra Pao](https://www.kitchenstories.com/en/recipes/pad-kra-pao-thai-holy-basil-and-pork-stir-fry)"],"filename":"recipes/cooked/pad-kra-pao-pork.md","referenceImage":"https://www.cooking-therapy.com/wp-content/uploads/2024/02/Pad-Kra-Pao-10-683x1024.jpg","photos":[]},{"id":"stir-fried-garlic-sprouts","title":"清炒蒜苗","status":"to-try","cuisine":"Chinese","category":"蔬菜","tags":["vegetables","garlic-sprouts","simple","quick-meal"],"cover":null,"ingredients":["蒜苗：约 300–400 g，洗净切段","蒜：1 瓣，可选"],"seasonings":["食用油：适量","盐：适量","生抽：少量，可选","糖：一小撮，可选"],"instructions":["蒜苗洗净并充分沥干，把较粗的根部和嫩叶分开。","锅充分预热后加油，先放蒜苗根部，大火快速翻炒。","根部开始变软后加入叶子和可选的蒜末，继续翻炒至颜色鲜亮、刚好断生。","加盐调味；按喜好加入少量生抽和糖，立即出锅。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["这是一个简单的参考版本；实际炒制时间和个人喜欢的软硬程度等做过后再记录。","目前还没有个人实拍照片。"],"sources":["参考做法与图片来源：[烂磁头 — 清炒蒜苗](https://blog.lancitou.net/gap-year-in-australia-d49/)"],"filename":"recipes/cooked/stir-fried-garlic-sprouts.md","referenceImage":"https://i.imgur.com/65tZM0jl.jpg","photos":[]},{"id":"silky-eggs-with-shrimp","title":"滑蛋虾仁（王刚家庭版）","status":"cooked","cuisine":"Chinese","category":"海鲜","tags":["seafood","eggs","simple","quick-meal"],"cover":"../../images/photos/silky-eggs-with-shrimp-photo-1.jpg","ingredients":["鲜虾：80 g（约 3 oz）","鸡蛋：5 个","葱花：适量"],"seasonings":["盐：1.5 g（约 ¼ tsp）","胡椒粉：少许，不到 ¼ tsp","白醋：少许","食用油：足量用于润锅，另加少量底油"],"instructions":["准备虾仁：用牙签从虾背挑出虾线。将虾放入沸水中煮，煮到虾身自然弯曲、完全熟透后捞出。去掉虾头，剥去虾壳，再从虾背将虾仁切成两半。","准备蛋液：将 5 个鸡蛋打入不锈钢盆中，加入盐 1.5 g、少许胡椒粉、少许白醋和葱花，充分搅打，直到蛋液表面出现少许泡沫。","润锅：将炒锅烧热，倒入足量食用油并推动锅铲，让油均匀覆盖锅内表面；倒出多余的油，再重新加入少量底油。","利用余温炒蛋：先将炒锅移开炉火，倒入蛋液，利用锅内余温让蛋液慢慢凝固，同时轻轻翻动。蛋液开始凝固后，将锅放回炉火上，用小火继续轻轻翻炒。","控制成熟度：炒约 50 秒时，鸡蛋柔软且已熟；约 60 秒时，鸡蛋更嫩滑；约 80 秒时，接近普通炒鸡蛋的状态。达到喜欢的成熟度后立即出锅，不要炒得过老；实际时间需要根据火力和锅温调整。"],"experience":["已实际做过，并提供了一张个人成品照片。"],"improvements":[],"nextSeasonings":[],"notes":["虾仁需要提前焯水煮熟，避免鸡蛋已经熟了而虾仁内部仍未熟透。","不需要加入味精、鸡精等额外增鲜调味料，让鸡蛋和虾仁保持自身鲜味。","通过约 50 秒、60 秒或 80 秒的炒制时间调整鸡蛋的柔软程度，但要根据实际火力和锅温灵活调整。"],"sources":[],"filename":"recipes/cooked/silky-eggs-with-shrimp.md","referenceImage":null,"photos":[{"originalFile":"Photo 1.jpg","displayFile":"silky-eggs-with-shrimp-photo-1.jpg","date":"日期未记录","identifiedAs":"滑蛋虾仁","matchStatus":"matched","recipeId":"silky-eggs-with-shrimp","note":"用户提供的滑蛋虾仁个人成品照片。","available":true,"publicPath":"./images/photos/silky-eggs-with-shrimp-photo-1.jpg"}]},{"id":"guo-bao-rou","title":"锅包肉","status":"to-try","cuisine":"Chinese","category":"肉类","tags":["meat","pork","northeast","sweet-sour","home-style"],"cover":null,"ingredients":["猪里脊或猪肩肉：约 400 g，切成薄片","土豆淀粉：约 100 g，用水调成厚浆","胡萝卜：少量，切细丝","葱：少量，切丝","姜：少量，切丝","香菜：少量，可选"],"seasonings":["盐：约 ½ tsp，用于腌肉","白糖：约 3–4 tbsp","白醋或米醋：约 3–4 tbsp","蒜：1–2 瓣，切片","食用油：足量，用于炸肉","水：少量，用于调淀粉浆"],"instructions":["淀粉加水调成较厚的浆，静置一会儿，让淀粉充分吸水。","猪肉切薄片，用盐抓匀，静置约 10 分钟；准备好胡萝卜、葱、姜和蒜。","将肉片均匀裹上淀粉浆，放入中温油中炸至定型并略微金黄，捞出静置片刻。","将油温升高，把肉片复炸至表面酥脆，捞出沥油。","另起锅，加入糖、醋和少量水，小火煮至糖融化、酱汁略微变稠。","加入蒜、姜丝、胡萝卜丝和葱丝，快速翻动。","放入炸好的肉片，迅速翻匀，让酱汁薄薄裹住表面，立即出锅。"],"experience":[],"improvements":[],"nextSeasonings":[],"notes":["锅包肉是东北风味的酸甜脆皮猪肉，关键是土豆淀粉外壳和二次复炸。","酱汁不要收得过厚，也不要让肉片在锅里停留太久，否则外壳会变软。","这是一个典型参考版本；目前没有个人实拍照片。"],"sources":["参考做法：[The Soy Food Cookbook — 锅包肉](https://soyfood.cooking/asian_dishes/section-34e3f440dad631cf8d085c8c3eca894b/recipe-90a3be70 t every photo can be matched to a dish with certainty.","photoArchiveIntro2":"Confirmed matches stay in the archive; uncertain ones stay separate.","imageBannerTitle":"About image files","imageBannerWithPending":"{count} JPEG display images are connected; original HEIC files remain in the library. Unconfirmed photos stay in the review archive and are not automatically linked to recipes.","imageBannerAllConfirmed":"{count} JPEG display images are connected; original HEIC files remain in the library. All current photos have been linked to recipes based on your confirmation.","imageBannerNone":"Only filenames and review records are available. Add real JPG files to the images/photos/ folder and rebuild the site to display them.","confirmedKicker":"01 / CONFIRMED","confirmedTitle":"Confirmed matches","confirmedSubtitle":"Confirmed as belonging to existing recipes","toReviewKicker":"02 / TO REVIEW","toReviewTitle":"To review","toReviewSubtitle":"Keep possibilities separate until confirmed","photoConfirmed":"✓ Confirmed","photoReview":"◌ To review","viewRecipe":"View recipe","originalLabel":"ORIGINAL","displayLabel":"DISPLAY","unassigned":"Not linked to a formal recipe","aboutKicker":"03 / THE PHILOSOPHY","aboutTitle1":"Not a recipe encyclopedia,","aboutTitle2":"a real kitchen diary.","aboutIntro":"Every dish comes from something actually cooked. Write down what is known; leave unknowns blank.","principle1Title":"Truth over completeness","principle1Text":"Missing times, amounts, and steps are marked as not recorded instead of being guessed.","principle2Title":"Failures belong here too","principle2Text":"Actual experience and next-time suggestions stay separate. A suggestion is not a fact.","principle3Title":"Photos need confirmation","principle3Text":"Only reliably matched photos are linked to recipes. Unconfirmed photos are not used to prove missing facts.","howItWorks":"HOW IT WORKS","aboutFootTitle":"Markdown holds the content; the website presents it.","aboutFootText":"Each recipe has its own Markdown file. Edit the ingredients, steps, or notes, then rebuild the site—no database or back end required.","goRecipes":"View recipes","categories":{"全部":"All","海鲜":"Seafood","蔬菜":"Vegetables","鸡蛋":"Eggs","汤":"Soup","肉类":"Meat","沙拉":"Salads"},"tags":{"cabbage":"Cabbage","chicken":"Chicken","dressing":"Dressing","eggs":"Eggs","fish":"Fish","garlic":"Garlic","garlic-sprouts":"Garlic sprouts","glass-noodles":"Glass noodles","green-beans":"Green beans","honey":"Honey","home-style":"Home style","iceberg-lettuce":"Iceberg lettuce","lamb":"Lamb","meat":"Meat","mushrooms":"Mushrooms","northeast":"Northeast China","padron-peppers":"Padrón peppers","pak-choi":"Pak choi","pressure-cooker":"Pressure cooker","quick-meal":"Quick meal","salad":"Salad","salmon":"Salmon","sichuan":"Sichuan","seafood":"Seafood","simple":"Simple","soup":"Soup","spanish":"Spanish","spicy":"Spicy","stew":"Stew","steamed":"Steamed","sweetheart-cabbage":"Sweetheart cabbage","sweet-sour":"Sweet and sour","tapas":"Tapas","thai":"Thai","vegetables":"Vegetables","pork":"Pork","braised":"Braised"}}},"recipes":{"garlic-shrimp":{"title":"Garlic Shrimp","category":"Seafood","ingredients":["Frozen peeled shrimp","Garlic","Dried chili"],"seasonings":["Light soy sauce","Oyster sauce","Sugar"],"instructions":["Defrost the shrimp, drain them, and pat away excess moisture.","Mince the garlic and cut the dried chili into pieces; remove the seeds if desired.","Gently fry the garlic and dried chili in oil over low heat until fragrant.","Add the shrimp and stir-fry until fully cooked.","Add light soy sauce, oyster sauce, and a little sugar; toss to combine."],"experience":["I have cooked this dish.","Removing the seeds from dried chili reduces the heat.","Do not burn the garlic or dried chili, or they will taste bitter.","Drain frozen shrimp as thoroughly as possible."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: The Kitchn — Garlic Butter Shrimp"]},"blanched-iceberg-lettuce":{"title":"Blanched Iceberg Lettuce (Cantonese Style)","category":"Vegetables","ingredients":["Iceberg lettuce: ½ head, serves 1–2","Garlic: 2–3 cloves","Water: about 1–1.5 litres for blanching"],"seasonings":["Oyster sauce: 1 tbsp (15 ml)","Light soy sauce: 1 tbsp (15 ml)","Sugar: ½ tsp","Cooking oil: 1 tbsp for the garlic sauce","Salt: ½ tsp for the blanching water","Cooking oil: ½ tsp for the blanching water"],"instructions":["Prepare the lettuce: tear ½ head of Iceberg lettuce into large leaves, wash, and drain thoroughly. Do not tear the pieces too small, or they will soften too much after blanching. Mince the garlic.","Make the oyster sauce: mix 1 tbsp oyster sauce, 1 tbsp light soy sauce, ½ tsp sugar, and 2 tbsp water in a small bowl.","Blanch the lettuce: bring about 1–1.5 litres of water to a rolling boil, then add ½ tsp salt and ½ tsp oil. Add the lettuce and blanch Iceberg lettuce for only 10–20 seconds. It should soften slightly while staying crisp. Remove it immediately, drain thoroughly, and do not rinse it in cold water.","Make the garlic oyster sauce: heat 1 tbsp oil over medium-low heat. Fry the garlic for about 15–25 seconds until fragrant, then add the prepared sauce. Bring it just to a simmer and cook for another 15–20 seconds. Do not let the garlic burn, or it will taste bitter.","Pour the hot garlic oyster sauce evenly over the lettuce and serve immediately."],"experience":["I have made this dish and thought it was delicious."],"notes":["Iceberg lettuce is crisper and more watery than the lettuce commonly used in Guangdong, so the blanching time should be short; 10–20 seconds is usually enough.","Drain the lettuce thoroughly so the oyster sauce is not diluted.","Oyster sauce and light soy sauce already contain salt, so the sauce usually needs no extra salt.","Little Gem lettuce is also worth trying in London because its thicker leaves hold their shape better after blanching. Iceberg lettuce works well if that is what you have.","The image is a personal finished-dish photo supplied by the user; the cooking date was not recorded."],"sources":["User-provided home recipe; personal photo supplied by the user."]},"garlic-oyster-sauce-pak-choi":{"title":"Garlic Oyster Sauce Pak Choi","category":"Vegetables","ingredients":["A reference recipe for about 2 pak choi","Pak choi: about 2 heads","Garlic: 2 cloves","Red chili: ½–1"],"seasonings":["Oyster sauce: 1 tbsp","Light soy sauce: 1 tsp","Dark soy sauce: a little, optional","Sesame oil: ½ tsp","Cornstarch: ¼ tsp or less","Water: about 3 tbsp, adjust as needed"],"instructions":["Wash the pak choi and cut each head in half or into quarters.","Place the stems in boiling water for about 10–15 seconds, then add the leaves and blanch briefly.","Drain thoroughly.","Heat oil in a pan and fry the garlic and red chili until fragrant.","Add the pre-mixed sauce and simmer briefly until slightly thickened.","Pour the sauce over the pak choi."],"experience":["I made this dish and took photos.","The leaves were a little too soft last time.","The sauce was too thick and there was slightly too much of it."],"improvements":["Shorten the blanching time.","Use less cornstarch or add a little more water.","There is no need to pour on so much sauce."],"sources":["Khin's Kitchen — Pak Choi with Garlic Sauce (source URL not recorded)"]},"tomato-and-eggs":{"title":"Tomato and Scrambled Eggs","category":"Eggs","ingredients":["Tomatoes","Eggs"],"seasonings":["Salt","Sugar","Oil"],"instructions":["Beat the eggs, stir-fry until just set, and remove from the pan.","Cut the tomatoes into chunks and stir-fry with salt until softened.","Press some of the tomato pieces to help release their juices.","Return the cooked eggs to the pan.","Adjust the flavor with sugar and salt."],"experience":["I have cooked this dish, but the last attempt was not very successful.","The tomatoes available in the UK were quite firm.","They stayed in chunks after cooking and released very little juice.","After adding water, the finished dish still became rather dry."],"improvements":["Buy ripe, softer tomatoes.","Cook the tomatoes separately for 4–6 minutes.","Cover the pan and braise briefly if needed.","Add a little tomato paste to help create more sauce when necessary."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: iCook — Tomato and Egg Stir-Fry"]},"hand-torn-cabbage":{"title":"Stir-Fried Hand-Torn Cabbage","category":"Vegetables","ingredients":["Sweetheart cabbage","Garlic","Dried chili"],"nextSeasonings":["Light soy sauce: 2 tsp","Vinegar: 1 tsp","Sugar: ¼–½ tsp"],"instructions":["Tear the cabbage into pieces, wash it, and drain thoroughly.","Mince the garlic and cut the dried chili into pieces.","Preheat the pan thoroughly and add oil.","Briefly fry the garlic and dried chili until fragrant.","Add the thicker stems first, followed by the leaves.","Stir-fry quickly over high heat.","Add light soy sauce, vinegar, and sugar at the end."],"experience":["I cooked it, but the last attempt was not ideal.","It was stir-fried for about 5 minutes.","The cabbage was tender but lacked wok-charred aroma.","There was some water at the bottom of the plate.","About 1 tbsp of vinegar may have been too much."],"improvements":["Drain the cabbage thoroughly after washing.","Make the pan hotter.","Cook in batches if there is too much cabbage.","Stir less frequently.","Try shortening the cooking time to about 2–3 minutes.","Start with 1 tsp vinegar."]},"pressure-cooker-chicken-soup":{"title":"Pressure Cooker Chicken Soup","category":"Soup","ingredients":["Chicken","Water"],"instructions":["Put the chicken in the pressure cooker.","Add water.","Cook the soup in the pressure cooker. About one hour was mentioned previously, but the exact pressure-cooking time and setting have not been confirmed."],"experience":["I have made this dish.","The seasonings, amount of chicken, and pressure-cooking time have not been recorded; these can be added next time."],"notes":["The image above is a web reference image, not a personal cooking photo."],"sources":["Web reference image: Wikimedia Commons — Chinese Food - Chicken Soup (CC BY-SA 3.0)"]},"soy-sauce-lamb-ribs":{"title":"Soy Sauce Lamb Ribs","category":"Meat","ingredients":["Lamb ribs"],"seasonings":["Soy sauce","Other seasonings not recorded"],"experience":["I have made this dish.","It was an improvised soy-sauce-style dish rather than a strict Chinese recipe."],"notes":["The image above is a web reference image, not a personal cooking photo; it shows a similar braised lamb-rib style rather than the actual finished dish."],"sources":["Web reference image: Sohu — Braised Lamb Ribs"]},"vinegar-braised-cabbage":{"title":"Vinegar-Fried Cabbage","category":"Vegetables","ingredients":["Cabbage: about 400 g","Garlic: about 10 g","Dried chili: about 5 g","Sichuan peppercorns: about 2 g, optional"],"seasonings":["Chinkiang vinegar: about 20 ml","Light soy sauce: about 10 ml","Sugar: about 5 g","Salt: about 3 g","Cooking oil: about 25 ml"],"instructions":["Separate the cabbage stems from the leaves; slice the stems diagonally and tear the leaves into large pieces.","Heat oil in a pan, fry the Sichuan peppercorns over low heat until fragrant, then remove them.","Add the dried chili and garlic and fry briefly until fragrant.","Turn the heat high, stir-fry the stems for about 1 minute, then add the leaves for about 30 seconds.","Pour the vinegar around the edge of the pan and toss quickly.","Add the soy sauce, sugar, and salt; toss briefly and serve immediately."],"experience":["I have made this dish and took a photo."],"improvements":["Not recorded. Public reference recipes emphasize separating stems and leaves and stir-frying quickly over high heat to reduce excess water and preserve crunch."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 15 October 2026 photo."],"sources":["Reference recipe: SciCook — Vinegar Cabbage"]},"padron-peppers-tapas":{"title":"Padrón Peppers Tapas","category":"Vegetables","ingredients":["Padrón peppers: about 500 g"],"seasonings":["Spanish olive oil: as needed (one public reference uses about 300 ml)","Sea-salt flakes: as needed"],"instructions":["Wash the Padrón peppers and drain them thoroughly.","Heat the olive oil in a pan.","Add the peppers and fry until the skins blister and turn golden.","Drain off excess oil, arrange on a plate, and sprinkle with sea salt. Serve hot."],"experience":["I have made this dish and took a photo.","This is a Spanish tapas dish."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 17 October 2026 photo."],"sources":["Reference recipe: Foods and Wines from Spain — Padrón Peppers"]},"coca-cola-chicken-wings":{"title":"Coca-Cola Chicken Wings","category":"Meat","ingredients":["Chicken wings: about 8","Sugared Coca-Cola: about 1 can"],"seasonings":["Salt: to taste","Shaoxing wine: about 1 tbsp","Light soy sauce: about 10 ml","Dark soy sauce: about 5–7 ml","Ginger: about 5 slices","Cinnamon: ½–1 stick, optional","Star anise: optional"],"instructions":["Score or pierce both sides of the wings to help them absorb flavor; marinate with cooking wine and dark soy sauce for about 30 minutes to 2 hours if desired.","Start the wings in cold water with ginger; bring to a boil, skim the foam, rinse with warm water, and pat dry.","Pan-fry the wings over low heat until golden on both sides.","Add the Coca-Cola, cooking wine, light soy sauce, dark soy sauce, and optional spices; the liquid should nearly cover the wings.","Simmer over low heat until the wings are cooked and the liquid has reduced.","Turn up the heat to reduce the sauce until it coats the wings; adjust with salt if needed."],"experience":["I have made this dish and took a photo."],"notes":["The amounts and steps above are a typical reference version, not the exact amounts or steps used for the 25 October 2026 photo."],"sources":["Reference recipe: Xiachufang — Coca-Cola Chicken Wings","Reference overview: Wikipedia — Coca-Cola Chicken Wings"]},"fish-vinaigrette":{"title":"Salmon, Egg and Mixed-Greens Salad with Fish Vinaigrette","category":"Salads","ingredients":["Mixed salad greens: 2–3 generous handfuls","Cooked salmon: 1 fillet, about 120–150 g","Hard-boiled eggs: 2","Cherry tomatoes: 8–10","Avocado: ½","Optional feta or another mild white cheese","Optional black sesame seeds"],"seasonings":["Extra-virgin olive oil: 3 parts","Vinegar: 1 part","Salt: to taste","Pepper: to taste","Italian spices: to taste"],"instructions":["Make the vinaigrette: add the olive oil, vinegar, salt, pepper, and Italian spices to a small transparent container with a firm lid. Seal it tightly and shake until combined.","Build the salad: arrange the greens in a large serving dish, add the tomatoes and avocado, then arrange the salmon and boiled eggs on top.","Finish: add the optional cheese and black sesame seeds, shake the vinaigrette again, drizzle it over the salad, and serve immediately."],"experience":["I have made this dish and took two finished-dish photos."],"notes":["Both photos belong to this salmon salad. The actual cooking date has not been recorded."]},"honey-mustard-chicken-salad-sauce":{"title":"Honey Mustard Chicken Salad","category":"Salads","ingredients":["Thinly sliced chicken breast: 120 g","Mixed salad greens: 2–3 generous handfuls","Hard-boiled eggs: 2","Cherry tomatoes: 8–10","Avocado: ½","A small handful of roughly chopped nuts","Optional feta or another mild white cheese","Optional black sesame seeds"],"seasonings":["Extra-virgin olive oil: 1 tbsp (15 ml)","Dijon mustard: 1 tbsp (15 g), or 2 tsp Dijon plus 1 tsp wholegrain mustard","Honey: 2 tsp (10 ml)","Apple cider vinegar or fresh lemon juice: 1 tsp (5 ml)","Fine sea salt: 1 pinch","Freshly cracked black pepper: 1 pinch","Optional garlic powder or fresh chives"],"instructions":["Prepare the chicken: if using raw chicken, season and cook it through, rest briefly, and slice thinly; use ready-cooked chicken slices directly.","Combine the dressing base: whisk the mustard, honey, vinegar or lemon juice, salt, and pepper until smooth.","Emulsify the oil: slowly drizzle in the olive oil while whisking briskly until glossy and thickened.","Adjust the consistency: whisk in ½ tsp warm water if a thinner dressing is wanted.","Assemble the salad: add the greens, tomatoes, and avocado, then arrange the eggs, chicken, nuts, and optional toppings.","Dress and serve: toss the chicken with half the dressing and drizzle the rest over the greens immediately before serving."],"experience":["I have made this dish, but the specific experience has not been recorded."],"notes":["This makes roughly 2½ tbsp of dressing for 120 g chicken. If using raw chicken, 1 tbsp of the dressing can be added to the pan over low heat for 30–45 seconds to lightly glaze it; use the rest cold over the salad.","The cooking date and personal photo have not been recorded."]},"red-braised-pork":{"title":"Red-Braised Pork Belly","category":"Meat","ingredients":["Pork belly: about 500 g, cut into 3–4 cm cubes","Ginger: about 5 slices","Scallions: 2–3 sections"],"seasonings":["Rock sugar: about 25–30 g","Light soy sauce: about 2 tbsp","Dark soy sauce: about 1 tbsp, for colour","Shaoxing wine: about 2 tbsp","Star anise: 1–2","Cinnamon: 1 small piece, optional","Water: enough to nearly cover the pork","Salt: adjust at the end"],"instructions":["Start the pork in cold water with a little ginger. Bring it to a boil, skim the foam, then drain and pat dry.","Use a little oil to brown the pork on all sides, then remove it.","Melt the rock sugar over low heat until amber; do not burn it.","Return the pork and add the ginger, scallions, star anise, and cinnamon. Toss to coat.","Add the soy sauces and Shaoxing wine, then add hot water.","Bring to a boil, cover, and braise over low heat for about 60–90 minutes until tender.","Uncover and reduce the sauce over medium-high heat; adjust with salt."],"notes":["A typical reference version; actual amounts and cooking time can be recorded after it is made.","The image is a web reference, not a personal cooking photo."],"sources":["Reference recipe: TravelChinaGuide — Red Braised Pork"]},"dongbei-chicken-mushroom-stew":{"title":"Dongbei Chicken and Mushroom Stew","category":"Meat","ingredients":["Chicken pieces: about 700 g","Dried hazel mushrooms: about 30 g, or dried shiitake","Ginger: about 5 slices","Scallions: 2–3 sections"],"seasonings":["Light soy sauce: about 2 tbsp","Dark soy sauce: about 1 tsp, optional","Cooking wine: about 1 tbsp","Star anise: 1","Bay leaves: 1–2, optional","Salt: to taste","Water or strained mushroom-soaking water: as needed"],"instructions":["Soak the dried mushrooms until soft, rinse them, and reserve the clear soaking water.","Start the chicken in cold water, bring it to a boil, skim the foam, and rinse the pieces.","Fry the ginger and scallions until fragrant, then add the chicken and brown it lightly.","Add the soy sauces, cooking wine, star anise, and bay leaves.","Add the mushroom water and mushrooms. Bring to a boil, cover, and simmer for about 30–45 minutes.","Uncover to reduce the sauce and adjust with salt."],"notes":["This is a typical Dongbei-style reference version. Hazel mushrooms are traditional, but dried shiitake can be used.","The image is a web reference, not a personal cooking photo."],"sources":["Reference background: People's Daily — 小鸡炖蘑菇","Reference method: DayDayCook — 小鸡炖蘑菇"]},"chicken-glass-noodle-stew":{"title":"Chicken Stewed with Glass Noodles","category":"Meat","ingredients":["Chicken thighs or pieces: about 500 g","Glass noodles: about 100 g, soaked until soft","Ginger: about 5 slices","Garlic: 2 cloves, optional","Scallions: 2–3 sections"],"seasonings":["Light soy sauce: about 2 tbsp","Dark soy sauce: about 1 tsp, optional","Cooking wine: about 1 tbsp","Star anise: 1, optional","Salt: to taste","Black pepper: to taste","Water or chicken stock: as needed"],"instructions":["Soak the noodles according to the packet instructions and cut them shorter if needed.","Pat the chicken dry and brown it lightly in oil.","Add the ginger, garlic, scallions, and star anise and fry until fragrant.","Add the soy sauces and cooking wine, then pour in hot water or stock.","Bring to a boil, cover, and simmer for about 25–35 minutes until the chicken is nearly tender.","Add the softened noodles and simmer for another 5–10 minutes until they are tender but still springy.","Adjust with salt and black pepper and serve hot."],"notes":["Add the glass noodles near the end so they do not absorb too much liquid or break apart.","The image is a web reference, not a personal cooking photo."],"sources":["Reference recipe: Meishichina — Chicken Stewed with Glass Noodles"]},"gambas-al-ajillo":{"title":"Gambas al Ajillo (Spanish Garlic Prawns)","category":"Seafood","ingredients":["Peeled prawns: about 250–300 g","Extra-virgin olive oil: about 100–150 ml","Garlic: 4–6 cloves, thinly sliced","Dried chili: 1–2, sliced","Parsley: a little, optional"],"seasonings":["Salt: to taste","Black pepper: a little, optional","Lemon juice: a little, optional"],"instructions":["Thaw and pat the prawns dry. Tails or heads can be left on for more flavour.","Add the olive oil and garlic to a small pan or cazuela. Warm over low heat until the garlic is fragrant but not burnt.","Add the dried chili and heat briefly.","Turn the heat to medium-high, add the prawns and salt, and cook quickly until pink and just cooked, about 1–2 minutes per side.","Finish with parsley and optional lemon juice. Serve with the hot oil and bread for dipping."],"notes":["The dish you described—prawns in a small pan of abundant oil—is very likely gambas al ajillo, a Spanish tapas dish.","The image is a web reference, not a personal cooking photo."],"sources":["Reference background: Wikipedia — Gambas al Ajillo","Reference method: Table & Traditions — Gambas al Ajillo"]},"dry-fried-green-beans":{"title":"Sichuan Dry-Fried Green Beans","category":"Vegetables","ingredients":["Green beans: about 400–500 g, trimmed and cut into pieces","Minced pork: about 100 g, optional","Garlic: 3–4 cloves, minced","Ginger: a little, minced, optional","Dried chili: 4–6, cut into pieces","Sichuan peppercorns: a little"],"seasonings":["Cooking oil: as needed","Light soy sauce: about 1 tbsp","Shaoxing wine: about 1 tsp, optional","Sugar: ½ tsp, optional","Salt: to taste","Preserved mustard greens: a little, optional"],"instructions":["Wash the beans and dry them thoroughly. Cut them into pieces; excess water makes splattering more likely and prevents blistering.","Use a little more oil than for a normal stir-fry and cook the beans until wrinkled with small browned spots and fully tender. Remove them.","Leave a little oil in the pan and gently fry the Sichuan peppercorns and dried chili, then add the garlic and ginger.","If using pork, add it and cook until browned; add optional preserved mustard greens.","Return the beans and toss over high heat with the soy sauce, wine, sugar, and salt.","Cook until dry and fragrant, then serve immediately."],"notes":["The key dry-frying technique is to wrinkle and dehydrate the beans before adding the aromatics.","Green beans must be cooked through; do not stop at a browned surface.","The image is a web reference, not a personal cooking photo."],"sources":["Reference recipe: TravelChinaGuide — Sichuan Dry-fried Green Beans"]},"twice-cooked-pork":{"title":"Twice-Cooked Pork","category":"Meat","ingredients":["Skin-on pork belly: about 400–500 g","Garlic sprouts: about 100–150 g, cut into sections","Ginger: a few slices","Scallions: 2–3 sections","Sichuan peppercorns: a little"],"seasonings":["Pixian doubanjiang: about 1 tbsp","Fermented black beans: about 1 tsp, optional","Light soy sauce: about 1 tsp","Cooking wine: about 1 tbsp","Sugar: ½ tsp, optional","Dried chili: a little, optional"],"instructions":["Start the pork belly whole in cold water with ginger, scallions, and Sichuan peppercorns. Cook until just tender, cool, and slice as thinly as possible.","Stir-fry the slices over medium heat without much added oil until the edges curl and the fat renders.","Push the pork aside and fry the doubanjiang, fermented black beans, and dried chili in the rendered fat.","Add soy sauce, cooking wine, and sugar and toss until the pork is coated.","Add the firmer garlic-sprout stems first, then the leaves, and stir-fry quickly over high heat.","Serve immediately with rice."],"notes":["The defining technique is cooking the pork once, then returning it to the wok for a second cooking with doubanjiang and garlic sprouts.","A typical Sichuan reference version; actual heat and oil levels can be recorded after cooking.","The image is a web reference, not a personal cooking photo."],"sources":["Reference recipe: TravelChinaGuide — Twice Cooked Pork"]},"hunan-stir-fried-pork":{"title":"Hunan-Style Stir-Fried Pork with Peppers","category":"Meat","ingredients":["Pork: about 300–400 g, thinly sliced; a mix of pork belly and lean pork works well","Green or Hunan peppers: about 150–200 g, sliced diagonally","Garlic: 2–3 cloves","Ginger: a little, optional","Scallions: a little, optional"],"seasonings":["Light soy sauce: about 1 tbsp","Dark soy sauce: ½ tsp, optional","Oyster sauce: about 1 tsp, optional","Cooking wine: about 1 tsp","Salt: to taste","Sugar: a little, optional","Cooking oil: as needed"],"instructions":["Slice the pork thinly; if using lean pork, mix it with a little soy sauce and cooking wine and rest briefly.","Wash and dry the peppers and slice them diagonally. Preheat the wok thoroughly.","Stir-fry the pork over medium-high heat until coloured and lightly browned; render some fat if using pork belly.","Add the garlic, ginger, and scallions and fry until fragrant.","Add the peppers and stir-fry over high heat until lightly blistered but still crisp.","Add the soy sauces, oyster sauce, wine, salt, and optional sugar. Toss quickly and serve immediately."],"notes":["This home-style Hunan version highlights the aroma of pork and peppers. Slightly blistered peppers are more fragrant than very soft peppers.","The image is a web reference, not a personal cooking photo."],"sources":["Reference method: DayDayCook — Home-Style Stir-Fried Pork"]},"tom-yum-goong":{"title":"Tom Yum Goong","category":"Soup","ingredients":["Prawns: about 300–400 g","Stock or water: about 750 ml–1 L","Lemongrass: 2–3 stalks","Galangal: 5–8 slices","Makrut lime leaves: 4–6","Mushrooms: about 150 g","Optional cherry tomatoes and shallots","Coriander to finish"],"seasonings":["Fish sauce: about 2 tbsp","Lime juice: about 3–4 tbsp, added at the end","Thai bird's-eye chili: to taste","Nam Prik Pao: about 1 tsp, optional","Palm sugar or white sugar: a little, optional","Salt: to taste"],"instructions":["If keeping the prawn shells, fry them briefly and add water or stock to build the broth; ready-made stock can also be used.","Add lemongrass, galangal, lime leaves, shallots, and chili and simmer for 3–4 minutes.","Add the mushrooms and tomatoes and cook until just tender.","Add fish sauce and optional chili paste and sugar, then taste.","Add the prawns and cook until pink and just cooked, usually 1–2 minutes.","Turn off the heat, add lime juice and coriander, and balance the salty, sour, and spicy flavours."],"experience":["I have made this dish, but the exact amounts, sour-spicy balance, and personal experience have not been recorded."],"notes":["Lime juice is added after turning off the heat to preserve its brightness. There is no personal cooking photo."],"sources":["Reference recipe: SBS Food — Tom Yum Goong"]},"steamed-sea-bass":{"title":"Chinese Steamed Sea Bass","category":"Seafood","ingredients":["Sea bass: 1 whole fish, cleaned","Ginger slices and julienned ginger","Scallion sections and julienned scallions"],"seasonings":["Seasoned soy sauce for seafood: about 1–2 tbsp","Cooking oil: about 2 tbsp for the finishing pour","Cooking wine: a little, optional","Salt: a little, optional"],"instructions":["Clean the fish and score both sides. Season lightly with salt and cooking wine, then pat dry.","Put ginger and scallion sections on a plate, place the fish on top, and add a little ginger over the fish.","Steam over vigorously boiling water for about 8–12 minutes, depending on size.","Check the thickest part for doneness, then discard the steaming liquid and old aromatics.","Top with julienned ginger and scallions and pour the seasoned soy sauce around the fish.","Heat the oil until very hot and pour it over the ginger and scallions. Serve immediately."],"experience":["I have made this dish, but the fish weight, steaming time, and personal experience have not been recorded."],"notes":["Fresh fish, preheated steaming water, and avoiding overcooking are the main points. There is no personal cooking photo."],"sources":["Reference recipe: Woks of Love — Authentic Steamed Sea Bass"]},"pad-kra-pao-pork":{"title":"Pad Kra Pao Pork with Rice","category":"Meat","ingredients":["Minced pork: about 250–300 g","Jasmine rice: to serve","Holy basil or Thai basil: a generous handful","Garlic: 3–4 cloves","Thai bird's-eye chilies: 2–5","Optional shallot","Eggs: 1 per serving"],"seasonings":["Light soy sauce: about 1 tbsp","Fish sauce: about 1 tbsp","Oyster sauce: about 1 tsp","Sugar: ½–1 tsp","Water: a little to loosen the sauce","Cooking oil"],"instructions":["Mix the soy sauce, fish sauce, oyster sauce, sugar, and a little water.","Fry the egg in slightly more oil than usual until the edge is crisp and the yolk remains soft. Set aside.","Fry the garlic, chili, and optional shallot in the remaining oil.","Add the pork, break it up, and stir-fry until browned.","Add the sauce and cook until it is mostly reduced and coats the pork.","Turn off the heat, add the basil, and toss in the residual heat until just wilted.","Serve the basil pork over rice with the fried egg."],"experience":["I have made this dish, but the exact amounts, heat level, and personal experience have not been recorded."],"notes":["The pork, chili sauce, rice, and fried egg you described are the classic Pad Kra Pao combination. There is no personal cooking photo."],"sources":["Reference recipe: Kitchen Stories — Pad Kra Pao"]},"stir-fried-garlic-sprouts":{"title":"Simple Stir-Fried Garlic Sprouts","category":"Vegetables","ingredients":["Garlic sprouts: about 300–400 g","Garlic: 1 clove, optional"],"seasonings":["Cooking oil","Salt","A little light soy sauce, optional","A pinch of sugar, optional"],"instructions":["Wash and drain the garlic sprouts well and separate the thicker stems from the tender leaves.","Heat the wok thoroughly, add oil, and stir-fry the stems over high heat.","When the stems begin to soften, add the leaves and optional garlic and stir-fry until bright and just tender.","Season with salt and optional soy sauce and sugar, then serve immediately."],"notes":["A simple reference version; the actual cooking time and preferred texture can be recorded after it is made.","No personal cooking photo has been recorded."]},"silky-eggs-with-shrimp":{"title":"Silky Eggs with Shrimp (Wang Gang Home-Style)","category":"Seafood","ingredients":["Fresh shrimp: 80 g (about 3 oz)","Eggs: 5","Scallions: as needed"],"seasonings":["Salt: 1.5 g (about ¼ tsp)","Ground pepper: a little, less than ¼ tsp","White vinegar: a little","Cooking oil: enough for coating the wok, plus a little base oil"],"instructions":["Prepare the shrimp: use a toothpick to remove the vein. Boil the shrimp until the body naturally curls and is fully cooked. Remove the heads and shells, then split each shrimp in half along the back.","Prepare the egg mixture: crack 5 eggs into a stainless-steel bowl. Add 1.5 g salt, a little pepper, a little white vinegar, and the scallions. Beat thoroughly until a little foam appears on the surface.","Season the wok: heat the wok, add enough oil to coat the surface, and push the oil around with a spatula. Pour out the excess oil, then add a much smaller amount of base oil.","Use residual heat: move the wok off the heat, pour in the egg mixture, and gently move it as it slowly sets in the residual heat. When the eggs begin to set, return the wok to the hob and continue gently stirring over low heat.","Control the doneness: at about 50 seconds the eggs should be soft and cooked; at about 60 seconds they should be tender; at about 80 seconds they should resemble ordinary scrambled eggs. Remove them when they reach the preferred doneness and do not overcook them. Adjust the timing for the actual heat and wok temperature."],"experience":["I have made this dish and supplied a personal finished-dish photo.","Taste notes have not yet been recorded."],"notes":["Blanch the shrimp first so the eggs do not finish before the shrimp is safely cooked.","Avoid MSG, chicken bouillon, or other extra umami seasonings so the natural flavor of the eggs and shrimp remains clear.","The 50-, 60-, and 80-second timings are reference points from the chef's video; adjust them to the actual heat and wok temperature.","The image is a personal cooking photo from the recipe archive."],"sources":["User-provided Wang Gang home-style recipe transcription; original video link not recorded."]},"garlic-stir-fried-iceberg-lettuce":{"title":"Garlic Stir-Fried Iceberg Lettuce","category":"Vegetables","ingredients":["½ iceberg lettuce, about 250 g","Garlic: 3 cloves, finely minced","Cooking oil: 1 tbsp","Salt: about ¼ tsp","Light soy sauce: ½ tsp, optional"],"instructions":["Cut away the tough core, tear the leaves into 5–7 cm pieces, wash, and drain thoroughly. The drier the lettuce, the less water it will release in the pan.","Divide the minced garlic into two portions, using about two-thirds for the fragrant oil and the rest just before serving.","Preheat a wok or frying pan over medium-high heat for 30–60 seconds. Add the oil and two-thirds of the garlic and fry for 10–15 seconds, just until fragrant; do not let it turn dark yellow.","Turn the heat high, add all the lettuce, and stir-fry quickly for about 30 seconds. When it starts to soften, add the salt and remaining garlic and stir-fry for another 15–30 seconds.","Turn off the heat as soon as the edges soften and the thicker parts are still crisp. Serve immediately; do not add water or cover the pan."],"experience":["I have made this dish; detailed taste notes and improvements have not yet been recorded."],"notes":["For a 24–26 cm pan, keep each batch to about 200–250 g so the pan stays hot.","Add salt near the end to reduce excess water.","This is a personal photo from the recipe archive."]},"guo-bao-rou":{"title":"Guo Bao Rou (Crispy Sweet-and-Sour Pork)","category":"Meat","ingredients":["Pork loin or shoulder: about 400 g, thinly sliced","Potato starch: about 100 g, mixed into a thick batter","Carrot, scallion, ginger, and coriander: a little for garnish"],"seasonings":["Salt: about ½ tsp","Sugar: about 3–4 tbsp","White or rice vinegar: about 3–4 tbsp","Garlic: 1–2 cloves","Cooking oil for frying","Water: a little"],"instructions":["Mix the potato starch with water into a thick batter and let it hydrate.","Salt the pork and rest it for about 10 minutes. Prepare the carrot, scallion, ginger, and garlic.","Coat the pork and fry at moderate heat until set and lightly golden; remove and rest briefly.","Raise the oil temperature and fry the pork a second time until crisp.","Simmer sugar, vinegar, and a little water until the sauce is dissolved and slightly thickened.","Add the aromatics, return the pork, toss quickly to coat lightly, and serve immediately."],"notes":["The Northeast Chinese version is defined by a crisp potato-starch coating and a quick sweet-and-sour glaze.","Do not reduce the sauce too far or leave the pork in it too long, or the crust will soften.","The image is a web reference, not a personal cooking photo."],"sources":["Reference recipe: The Soy Food Cookbook — 锅包肉"]}},"photos":{"hand-torn-cabbage-2026-10-12.jpg":{"identifiedAs":"Hand-torn cabbage","note":"A reliable match for hand-torn cabbage; the photo alone cannot show which attempt it was."},"hand-torn-cabbage-2026-10-29.jpg":{"identifiedAs":"Hand-torn cabbage","note":"A reliable match for hand-torn cabbage; the photo alone cannot show which attempt it was."},"garlic-oyster-sauce-pak-choi-2026-10-25.jpg":{"identifiedAs":"Garlic oyster sauce pak choi","note":"A reliable match for this recipe."},"stir-fried-cabbage-vegetable-review-2026-10-15.jpg":{"identifiedAs":"Vinegar-fried cabbage","note":"User-confirmed as vinegar-fried cabbage."},"pan-fried-green-peppers-review-2026-10-17.jpg":{"identifiedAs":"Padrón Peppers Tapas","note":"User-confirmed as Spanish Padrón peppers tapas."},"soy-glazed-chicken-review-2026-10-25.jpg":{"identifiedAs":"Coca-Cola chicken wings","note":"User-confirmed as Coca-Cola chicken wings."},"fish-vinaigrette-1.jpg":{"date":"Not recorded","identifiedAs":"Salmon, egg and mixed-greens salad","note":"A personal cooking photo supplied with the fish vinaigrette recipe."},"fish-vinaigrette-2.jpg":{"date":"Not recorded","identifiedAs":"Salmon, egg and mixed-greens salad","note":"A personal cooking photo supplied with the fish vinaigrette recipe."},"silky-eggs-with-shrimp-photo-1.jpg":{"date":"Not recorded","identifiedAs":"Silky eggs with shrimp","note":"A personal finished-dish photo supplied by the user."},"blanched-iceberg-lettuce-photo-1.jpg":{"date":"Not recorded","identifiedAs":"Blanched Iceberg Lettuce (Cantonese Style)","note":"A personal finished-dish photo supplied by the user."}},"nl":{"ui":{"brand":"Kooknotities","brandSubtitle":"HET KOOKDAGBOEK","brandAria":"Mijn kooknotities, naar de startpagina","recipes":"Recepten","photos":"Fotoarchief","about":"Over dit archief","languageAria":"Taal kiezen","l
