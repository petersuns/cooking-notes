bak ze tot ze net gestold zijn en haal ze uit de pan.","Snijd de tomaten in stukken en roerbak ze met zout tot ze zacht worden.","Druk enkele tomaatstukken plat zodat ze hun sap loslaten.","Doe de gebakken eieren terug in de pan.","Breng op smaak met suiker en zout."],"experience":["Ik heb dit gerecht gemaakt, maar de vorige poging was niet erg geslaagd.","De tomaten die in het Verenigd Koninkrijk verkrijgbaar waren, waren vrij hard.","Ze bleven na het bakken in stukken en gaven weinig sap af.","Na het toevoegen van water werd het eindresultaat toch vrij droog."],"improvements":["Koop rijpe, zachtere tomaten.","Bak de tomaten eerst 4–6 minuten apart.","Dek de pan eventueel af en laat de tomaten kort stoven.","Voeg zo nodig een beetje tomatenpuree toe voor meer saus."],"notes":["De afbeelding hierboven is een webreferentie, geen persoonlijke kookfoto."],"sources":["Webreferentie: iCook — Tomato and Eggs"]},"hand-torn-cabbage":{"title":"Met de hand gescheurde kool","category":"Groenten","ingredients":["Spitskool","Knoflook","Gedroogde chilipeper"],"instructions":["Scheur de kool in stukken, was die en laat goed uitlekken.","Hak de knoflook fijn en knip de gedroogde chilipeper in stukjes.","Verhit de pan goed en voeg olie toe.","Bak de knoflook en chilipeper kort tot ze geuren.","Voeg eerst de dikkere stronken toe en daarna de bladeren.","Roerbak snel op hoog vuur.","Voeg op het einde sojasaus, azijn en suiker toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen.","De bereiding duurde ongeveer 5 minuten.","De kool was mals, maar had weinig geroosterde smaak.","Er lag wat vocht op de bodem van het bord."],"improvements":["Laat de kool na het wassen goed uitlekken.","Verhit de pan sterker.","Bak in porties als er te veel kool is.","Roer minder vaak.","Probeer de baktijd te verkorten tot ongeveer 2–3 minuten.","Begin met 1 tl azijn."],"nextSeasonings":["Lichte sojasaus: 2 tl","Azijn: 1 tl","Suiker: ¼–½ tl"]},"pressure-cooker-chicken-soup":{"title":"Kippens n donkere sojasaus.","Begin de vleugels in koud water met gember; breng aan de kook, schep het schuim eraf, spoel met warm water en dep droog.","Bak de vleugels op laag vuur in de pan tot beide kanten goudbruin zijn.","Voeg Coca-Cola, kookwijn, lichte en donkere sojasaus en de optionele specerijen toe; de vloeistof moet de vleugels bijna bedekken.","Laat op laag vuur sudderen tot de vleugels gaar zijn en de vloeistof is ingekookt.","Zet het vuur hoger om de saus in te koken tot die aan de vleugels kleeft; voeg zo nodig zout toe."],"experience":["Ik heb dit gerecht gemaakt en een foto genomen."],"notes":["De hoeveelheden en stappen hierboven zijn een typische referentieversie, niet exact de hoeveelheden of stappen die voor de foto van 25 oktober 2026 zijn gebruikt."],"sources":["Referentierecept: Xiachufang — Coca-Cola Chicken Wings","Referentieoverzicht: Wikipedia — Coca-Cola Chicken Wings"]}},"photos":{"hand-torn-cabbage-2026-10-12.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"hand-torn-cabbage-2026-10-29.jpg":{"identifiedAs":"Met de hand gescheurde kool","note":"Betrouwbaar gekoppeld aan met de hand gescheurde kool; de foto alleen laat niet zien om welke poging het gaat."},"garlic-oyster-sauce-pak-choi-2026-10-25.jpg":{"identifiedAs":"Paksoi met knoflook en oestersaus","note":"Betrouwbaar gekoppeld aan dit recept."},"stir-fried-cabbage-vegetable-review-2026-10-15.jpg":{"identifiedAs":"Kool met azijn","note":"Door de gebruiker bevestigd als kool met azijn."},"pan-fried-green-peppers-review-2026-10-17.jpg":{"identifiedAs":"Tapas met Padrónpepers","note":"Door de gebruiker bevestigd als Spaanse tapas met Padrónpepers."},"soy-glazed-chicken-review-2026-10-25.jpg":{"identifiedAs":"Kipvleugels met Coca-Cola","note":"Door de gebruiker bevestigd als kipvleugels met Coca-Cola."}}}}}</script>
